<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="MyPlan"/>
  <meta name="application-name" content="MyPlan"/>
  <meta name="theme-color" content="#1e1c17"/>
  <meta name="description" content="MyPlan — Long Range Training Calendar"/>
  <title>MyPlan</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon.svg"/>
  <link rel="icon" type="image/svg+xml" href="icon.svg"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* iOS safe area insets — these are the key fix */
    :root {
      --sat: env(safe-area-inset-top,    0px);
      --sar: env(safe-area-inset-right,  0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left,   0px);
    }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: #1e1c17;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    #root {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #splash {
      position: fixed; top: 0; right: 0; bottom: 0; left: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #1e1c17;
      gap: 14px; z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #splash.fade { opacity: 0; pointer-events: none; }
    #splash-dot {
      width: 10px; height: 10px;
      background: #8aaa7c; border-radius: 50%;
      animation: pulse 1.4s ease-in-out infinite;
    }
    #splash-name { font-size: 24px; font-weight: 700; letter-spacing: 2px; color: #f0ece0; }
    #splash-sub  { font-size: 10px; color: #6e6548; letter-spacing: 3px; }
    #splash-err  {
      font-size: 11px; color: #fca5a5; display: none;
      text-align: center; padding: 0 32px; line-height: 1.6;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50%       { opacity: 1;   transform: scale(1.2); }
    }
    #offline-banner {
      display: none; position: fixed;
      top: var(--sat); left: var(--sal); right: var(--sar);
      background: #3a3220; color: #d4b878; font-size: 11px;
      text-align: center; padding: 5px; z-index: 8000;
    }
    body.offline #offline-banner { display: block; }
  </style>
</head>
<body>
  <div id="offline-banner">Offline — changes will sync when reconnected</div>
  <div id="splash">
    <div id="splash-dot"></div>
    <div id="splash-name">MyPlan</div>
    <div id="splash-sub">LONG RANGE TRAINING CALENDAR</div>
    <div id="splash-err"></div>
  </div>
  <div id="root"></div>

  <!-- Step 1: Set real viewport height via JS — fixes iOS PWA portrait bug -->
  <script>
    function setVH() {
      var h = window.innerHeight;
      document.getElementById('root').style.height = h + 'px';
    }
    setVH();
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', function() {
      setTimeout(setVH, 200);
    });
  </script>

  <!-- Step 2: Kill any old service workers -->
  <script>
    (function() {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) {
            // Only unregister old versions — keep v3
            if (reg.active && reg.active.scriptURL &&
                !reg.active.scriptURL.includes("sw.js")) {
              reg.unregister();
            }
          });
        }).catch(function(){});
        // Also clear old caches
        if ("caches" in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(k) {
              if (k !== "myplan-v3") caches.delete(k);
            });
          }).catch(function(){});
        }
      }
    })();
  </script>

  <!-- Step 2: React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Step 3: Pre-compiled app (plain JS — no Babel, no build tools) -->
  <script src="app.js"></script>

  <!-- Step 4: Mount + register new service worker -->
  <script>
    (function() {
      var splashErr = document.getElementById("splash-err");
      var splashDot = document.getElementById("splash-dot");

      function showError(msg) {
        splashDot.style.animation = "none";
        splashErr.style.display = "block";
        splashErr.innerHTML = msg;
        console.error("MyPlan:", msg);
      }

      // Check React loaded
      if (!window.React || !window.ReactDOM) {
        showError("React failed to load. Check your internet connection and refresh.");
        return;
      }

      // Check app loaded
      if (!window.__MyPlanApp) {
        showError("App script failed to load.<br>Try: <a href='/clear-sw.html' style='color:#8aaa7c'>Clear cache</a> then refresh.");
        return;
      }

      // Mount
      try {
        var root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(React.createElement(window.__MyPlanApp));
        var splash = document.getElementById("splash");
        splash.classList.add("fade");
        setTimeout(function(){ splash.style.display = "none"; }, 600);
      } catch(e) {
        showError("Mount error: " + e.message + "<br><a href='/clear-sw.html' style='color:#8aaa7c'>Clear cache</a>");
        return;
      }

      // Offline detection
      function updateOnline() {
        document.body.classList.toggle("offline", !navigator.onLine);
      }
      window.addEventListener("online",  updateOnline);
      window.addEventListener("offline", updateOnline);
      updateOnline();

      // Register new service worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function() {
          navigator.serviceWorker.register("sw.js")
            .then(function(r) { console.log("SW v3 registered:", r.scope); })
            .catch(function(e) { console.warn("SW registration failed:", e); });
        });
      }
    })();
  </script>
</body>
</html>
