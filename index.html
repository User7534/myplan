<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="MyPlan"/>
  <meta name="application-name" content="MyPlan"/>
  <meta name="theme-color" content="#1e1c17"/>
  <meta name="description" content="MyPlan — Long Range Training Calendar"/>
  <title>MyPlan</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon.svg"/>
  <link rel="icon" type="image/svg+xml" href="icon.svg"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #1e1c17;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    #root {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #splash {
      position: fixed; top: 0; right: 0; bottom: 0; left: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #1e1c17; gap: 14px; z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #splash.fade { opacity: 0; pointer-events: none; }
    #splash-dot {
      width: 10px; height: 10px; background: #8aaa7c;
      border-radius: 50%; animation: pulse 1.4s ease-in-out infinite;
    }
    #splash-name { font-size: 24px; font-weight: 700; letter-spacing: 2px; color: #f0ece0; }
    #splash-sub  { font-size: 10px; color: #6e6548; letter-spacing: 3px; }
    #splash-err  { font-size: 11px; color: #fca5a5; display: none; text-align: center; padding: 0 32px; line-height: 1.6; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50%       { opacity: 1; transform: scale(1.2); }
    }
    #offline-banner {
      display: none; position: fixed; top: 0; left: 0; right: 0;
      background: #3a3220; color: #d4b878; font-size: 11px;
      text-align: center; padding: 5px; z-index: 8000;
    }
    body.offline #offline-banner { display: block; }
  </style>
</head>
<body>
  <div id="offline-banner">Offline — changes will sync when reconnected</div>
  <div id="splash">
    <div id="splash-dot"></div>
    <div id="splash-name">MyPlan</div>
    <div id="splash-sub">LONG RANGE TRAINING CALENDAR</div>
    <div id="splash-err"></div>
  </div>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="app.js"></script>

  <script>
    (function() {
      var splashErr = document.getElementById("splash-err");
      var splashDot = document.getElementById("splash-dot");

      function showError(msg) {
        splashDot.style.animation = "none";
        splashErr.style.display = "block";
        splashErr.innerHTML = msg;
      }

      if (!window.React || !window.ReactDOM) {
        showError("React failed to load. Check connection and refresh.");
        return;
      }
      if (!window.__MyPlanApp) {
        showError("App failed to load. Please refresh.");
        return;
      }

      try {
        var root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(React.createElement(window.__MyPlanApp));
        var splash = document.getElementById("splash");
        splash.classList.add("fade");
        setTimeout(function(){ splash.style.display = "none"; }, 600);
      } catch(e) {
        showError("Error: " + e.message);
        return;
      }

      function updateOnline() {
        document.body.classList.toggle("offline", !navigator.onLine);
      }
      window.addEventListener("online", updateOnline);
      window.addEventListener("offline", updateOnline);
      updateOnline();

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function() {
          navigator.serviceWorker.register("sw.js")
            .then(function(r){ console.log("SW:", r.scope); })
            .catch(function(e){ console.warn("SW failed:", e); });
        });
      }
    })();
  </script>
</body>
</html>
