[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
  # Don't redirect the calendar feed or static files
  conditions = {Role = ["*"]}

# Edge function handles /calendar/* before the redirect catches it
[[edge_functions]]
  path = "/calendar/*"
  function = "calendar"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "max-age=86400"

[[headers]]
  for = "/calendar/*"
  [headers.values]
    Cache-Control = "no-cache, max-age=3600"
    Content-Type  = "text/calendar; charset=utf-8"
