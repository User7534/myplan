<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plastic Front</title>
<style>
  html,body{margin:0;height:100%;background:#14170f;overflow:hidden;font-family:"Trebuchet MS",Verdana,sans-serif}
  canvas{display:block;cursor:crosshair;touch-action:none}

<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   PLASTIC FRONT — Green vs. Tan
   A strategy/action hybrid: you play Sarge (direct control) and command
   a squad of little green army men against the Tan Overlord.
   ===================================================================== */

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let VW = 0, VH = 0, DPR = 1, Z = 1, HS = 1;
// touch play: twin virtual sticks + tap buttons
let touchMode = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
let moveStick = null, aimStick = null, commandMode = false;
const STICK_R = 60;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = innerWidth; VH = innerHeight;
  cvs.width = VW * DPR; cvs.height = VH * DPR;
  cvs.style.width = VW + 'px'; cvs.style.height = VH + 'px';
  Z = Math.max(0.55, Math.min(1.15, Math.min(VW / 1400, VH / 850)));
}
addEventListener('resize', resize); resize();

// ---------- helpers ----------
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const dist2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };
function lerpAngle(a, b, t) { let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const WORLD_W = 3000, WORLD_H = 2000;

// ---------- audio (synthesised, no files) ----------
let AC = null, master = null, noiseBuf = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function noise(dur, freq, type, vol, delay = 0) {
  const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function tone(f1, f2, dur, type, vol, delay = 0) {
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
const sfxLast = {};
function sfx(name, x, y) {
  if (!AC || muted) return;
  let v = 1;
  if (x !== undefined && G) { const d = Math.hypot(x - G.cam.x, y - G.cam.y); v = clamp(1 - d / 1200, 0, 1); if (v < 0.03) return; }
  const now = AC.currentTime, gap = name === 'flame' ? 0.09 : 0.035;
  if (sfxLast[name] && now - sfxLast[name] < gap) return; sfxLast[name] = now;
  switch (name) {
    case 'shot': noise(0.07, 2600, 'bandpass', 0.28 * v); tone(800, 200, 0.05, 'square', 0.03 * v); break;
    case 'tshot': noise(0.08, 1700, 'bandpass', 0.2 * v); break;
    case 'rocket': noise(0.35, 700, 'lowpass', 0.25 * v); tone(320, 110, 0.3, 'sawtooth', 0.05 * v); break;
    case 'cannon': noise(0.3, 400, 'lowpass', 0.45 * v); tone(140, 50, 0.25, 'square', 0.08 * v); break;
    case 'boom': noise(0.6, 520, 'lowpass', 0.7 * v); tone(120, 30, 0.5, 'sine', 0.5 * v); break;
    case 'bigboom': noise(1.4, 300, 'lowpass', 1 * v); tone(80, 20, 1.2, 'sine', 0.7 * v); break;
    case 'flame': noise(0.16, 1100, 'lowpass', 0.14 * v); break;
    case 'throw': tone(500, 950, 0.12, 'triangle', 0.08 * v); break;
    case 'pickup': tone(600, 1200, 0.1, 'square', 0.06); tone(900, 1800, 0.12, 'square', 0.05, 0.08); break;
    case 'recruit': tone(400, 800, 0.12, 'square', 0.07); tone(600, 1200, 0.12, 'square', 0.06, 0.1); break;
    case 'deny': tone(220, 150, 0.2, 'square', 0.08); break;
    case 'hurt': tone(320, 90, 0.18, 'sawtooth', 0.1); break;
    case 'alarm': tone(700, 420, 0.35, 'square', 0.06); tone(700, 420, 0.35, 'square', 0.06, 0.4); break;
    case 'shield': tone(1300, 1700, 0.07, 'sine', 0.06 * v); break;
    case 'heal': tone(900, 1400, 0.15, 'sine', 0.05 * v); break;
    case 'order': tone(500, 650, 0.06, 'square', 0.05); break;
    case 'win': [0, 0.15, 0.3, 0.5].forEach((d, i) => tone([523, 659, 784, 1046][i], [523, 659, 784, 1046][i], 0.3, 'square', 0.07, d)); break;
    case 'lose': [0, 0.25, 0.5].forEach((d, i) => tone([392, 330, 262][i], [392, 330, 220][i], 0.4, 'square', 0.07, d)); break;
  }
}

// ---------- definitions ----------
const COL = {
  g: { body: '#4f8a2c', light: '#79b347', dark: '#2c5417', base: '#3b6b21' },
  t: { body: '#c4a064', light: '#e8cb94', dark: '#8a6a38', base: '#a6844e' },
};

const WEAP = {
  // Sarge's arsenal
  s_rifle:   { cd: 0.13, dmg: 11, spd: 760, range: 420, spread: 0.05, kind: 'bullet', snd: 'shot' },
  s_bazooka: { cd: 0.85, dmg: 75, spd: 470, range: 560, splash: 85, kind: 'rocket', snd: 'rocket' },
  s_flamer:  { cd: 0.035, dmg: 3.6, spd: 330, range: 190, life: 0.5, spread: 0.22, kind: 'flame', snd: 'flame' },
  s_grenade: { cd: 0.55, dmg: 85, range: 380, splash: 100, kind: 'grenade', snd: 'throw' },
  // squad
  rifle:   { cd: 0.65, dmg: 9, spd: 650, range: 320, spread: 0.08, kind: 'bullet', snd: 'shot' },
  bazooka: { cd: 2.1, dmg: 55, spd: 420, range: 380, splash: 65, kind: 'rocket', snd: 'rocket' },
  flamer:  { cd: 0.06, dmg: 3.2, spd: 300, range: 165, life: 0.5, spread: 0.25, kind: 'flame', snd: 'flame' },
  heal:    { cd: 0.8, heal: 10, range: 90 },
  hq_mg:   { cd: 0.35, dmg: 8, spd: 650, range: 360, spread: 0.1, kind: 'bullet', snd: 'shot' },
  // tan
  t_rifle:   { cd: 1.0, dmg: 7, spd: 520, range: 300, spread: 0.13, kind: 'bullet', snd: 'tshot' },
  t_bazooka: { cd: 2.9, dmg: 38, spd: 360, range: 360, splash: 60, kind: 'rocket', snd: 'rocket' },
  t_cannon:  { cd: 2.5, dmg: 55, spd: 430, range: 400, splash: 70, kind: 'shell', snd: 'cannon' },
  t_mg:      { cd: 0.45, dmg: 6, spd: 560, range: 330, spread: 0.12, kind: 'bullet', snd: 'tshot' },
  b_rocket:  { cd: 0, dmg: 40, spd: 330, range: 700, splash: 70, kind: 'rocket', snd: 'rocket' },
  b_orb:     { cd: 0, dmg: 10, spd: 300, range: 700, kind: 'orb', snd: 'tshot' },
};

const TYPES = {
  sarge:    { team: 'g', hp: 240, speed: 160, r: 12, weapon: 's_rifle' },
  rifle:    { team: 'g', hp: 75, speed: 108, r: 10, weapon: 'rifle', sight: 340, cost: 40, name: 'Rifleman', key: 'Z' },
  bazooka:  { team: 'g', hp: 85, speed: 92, r: 10, weapon: 'bazooka', sight: 400, cost: 90, name: 'Bazooka', key: 'X' },
  flamer:   { team: 'g', hp: 120, speed: 98, r: 10, weapon: 'flamer', sight: 230, cost: 110, name: 'Flamer', key: 'C' },
  medic:    { team: 'g', hp: 70, speed: 118, r: 10, weapon: 'heal', sight: 300, cost: 80, name: 'Medic', key: 'V' },
  hq:       { team: 'g', hp: 1800, r: 46, building: true, weapon: 'hq_mg', sight: 360 },
  t_rifle:  { team: 't', hp: 50, speed: 92, r: 10, weapon: 't_rifle', sight: 320, bounty: 10 },
  t_bazooka:{ team: 't', hp: 60, speed: 82, r: 10, weapon: 't_bazooka', sight: 380, bounty: 20 },
  t_tank:   { team: 't', hp: 420, speed: 55, r: 22, weapon: 't_cannon', sight: 420, bounty: 60, vehicle: true },
  bunker:   { team: 't', hp: 800, r: 42, building: true, weapon: 't_mg', sight: 330, bounty: 120 },
  boss:     { team: 't', hp: 4200, speed: 75, r: 34, weapon: 't_mg', sight: 650, bounty: 500 },
};
const RECRUITS = ['rifle', 'bazooka', 'flamer', 'medic'];
const MAX_SQUAD = 14;

const LEVELS = [
  { name: 'Operation Backyard', theme: 'grass', brief: 'Destroy both Tan bunkers.',
    bunkers: [[2450, 520], [2550, 1450]], spawnRate: 7, cap: 4, raid: 0.25, waveT: 70,
    mix: [['t_rifle', 1]], guards: 3, obstacles: 55 },
  { name: 'Kitchen Floor Offensive', theme: 'tile', brief: 'Three bunkers and Tan tanks spotted. Wipe them out.',
    bunkers: [[2000, 380], [2650, 1000], [2000, 1620]], spawnRate: 6, cap: 5, raid: 0.35, waveT: 60,
    mix: [['t_rifle', 0.6], ['t_bazooka', 0.28], ['t_tank', 0.12]], guards: 3, obstacles: 50 },
  { name: "The Overlord's Sandbox", theme: 'sand', brief: 'The bunkers power the Overlord\'s shield. Destroy them, then the Overlord!',
    bunkers: [[1850, 450], [1850, 1550], [2350, 1000]], boss: [2700, 1000], spawnRate: 6, cap: 5, raid: 0.4, waveT: 55,
    mix: [['t_rifle', 0.55], ['t_bazooka', 0.3], ['t_tank', 0.15]], guards: 4, obstacles: 48 },
];

// ---------- input ----------
const keys = {};
const mouse = { x: 0, y: 0, wx: 0, wy: 0, left: false, right: false, drag: null };
addEventListener('keydown', e => {
  if (['Space', 'Tab', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) onKeyPress(e);
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.left = false; });
cvs.addEventListener('contextmenu', e => e.preventDefault());
cvs.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cvs.addEventListener('mousedown', e => {
  initAudio();
  touchMode = false;
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (e.button === 0) {
    if (state !== 'play') { onClickOverlay(); return; }
    if (hudClick(mouse.x, mouse.y)) return;
    if (e.shiftKey) { mouse.drag = { x: mouse.wx, y: mouse.wy }; return; }
    mouse.left = true;
  } else if (e.button === 2) {
    if (state === 'play') rightClick();
  }
});
addEventListener('mouseup', e => {
  if (e.button === 0) {
    mouse.left = false;
    if (mouse.drag && state === 'play') finishDrag();
    mouse.drag = null;
  }
});
cvs.addEventListener('wheel', e => {
  if (state !== 'play' || !G.sarge) return;
  e.preventDefault();
  cycleWeapon(e.deltaY > 0 ? 1 : -1);
}, { passive: false });

// ---- touch ----
cvs.addEventListener('touchstart', e => {
  e.preventDefault();
  initAudio();
  touchMode = true;
  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY;
    if (state !== 'play') { onClickOverlay(); return; }
    if (hudClick(x, y)) continue;
    if (commandMode) { orderAt((x - VW / 2) / Z + G.cam.x, (y - VH / 2) / Z + G.cam.y); commandMode = false; continue; }
    const st = { id: t.identifier, sx: x, sy: y, x, y };
    if (x < VW / 2) { if (!moveStick) moveStick = st; }
    else if (!aimStick) aimStick = st;
  }
}, { passive: false });
cvs.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    for (const st of [moveStick, aimStick]) if (st && st.id === t.identifier) { st.x = t.clientX; st.y = t.clientY; }
  }
}, { passive: false });
function endTouch(e) {
  e.preventDefault();
  initAudio();
  for (const t of e.changedTouches) {
    if (moveStick && moveStick.id === t.identifier) moveStick = null;
    if (aimStick && aimStick.id === t.identifier) aimStick = null;
  }
}
cvs.addEventListener('touchend', endTouch, { passive: false });
cvs.addEventListener('touchcancel', endTouch, { passive: false });
function stickVec(st) {
  if (!st) return null;
  let dx = st.x - st.sx, dy = st.y - st.sy;
  const l = Math.hypot(dx, dy);
  if (l > STICK_R) { st.sx = st.x - dx / l * STICK_R; st.sy = st.y - dy / l * STICK_R; dx = dx / l * STICK_R; dy = dy / l * STICK_R; }
  return { dx, dy, mag: Math.min(1, l / STICK_R) };
}

function onKeyPress(e) {
  initAudio();
  if (e.code === 'KeyM') { muted = !muted; return; }
  if (state === 'title' || state === 'levelwin' || state === 'over' || state === 'victory') {
    if (e.code === 'Enter' || e.code === 'Space') onClickOverlay();
    return;
  }
  if (e.code === 'Escape' || e.code === 'KeyP') { state = state === 'paused' ? 'play' : 'paused'; return; }
  if (state === 'paused') return;
  if (e.code === 'KeyH') { showHelp = !showHelp; return; }
  if (e.code.startsWith('Digit')) { const n = +e.code.slice(5) - 1; if (n >= 0 && n < 4) G.sarge.slot = n; }
  const ri = { KeyZ: 0, KeyX: 1, KeyC: 2, KeyV: 3 }[e.code];
  if (ri !== undefined) recruit(RECRUITS[ri]);
  if (e.code === 'Space') orderFollow();
  if (e.code === 'KeyG') orderHold();
  if (e.code === 'KeyQ') { G.sel.clear(); banner('', 'Whole squad selected', 1.2); }
}

// ---------- game state ----------
let state = 'title';
let G = null;
let showHelp = false;
let carry = { plastic: 120, squad: ['rifle', 'rifle'] };
let levelStartCarry = null;
let UID = 1;
let hudButtons = [];
let titleT = 0;

function spawn(type, x, y, extra) {
  const T = TYPES[type];
  const u = {
    id: UID++, type, T, x, y, hp: T.hp, maxHp: T.hp, r: T.r, team: T.team,
    a: T.team === 'g' ? 0 : Math.PI, ta: T.team === 'g' ? 0 : Math.PI,
    cd: rand(0, 0.8), target: null, retarget: rand(0, 0.3), order: { type: 'follow' },
    flash: 0, stuck: 0, detourT: 0, detourDir: 1, anim: rand(0, 6), moving: false, lastHit: 0,
  };
  if (extra) Object.assign(u, extra);
  G.units.push(u);
  return u;
}

function newLevel(idx) {
  const L = LEVELS[idx];
  const rng = mulberry32(777 + idx * 131);
  levelStartCarry = { plastic: carry.plastic, squad: carry.squad.slice() };
  G = {
    L, idx, units: [], bullets: [], parts: [], obs: [], pickups: [], decals: [], texts: [], pings: [],
    time: 0, shake: 0, plastic: carry.plastic, lives: 3, cam: { x: 400, y: 1000 }, sel: new Set(),
    banner: null, respawn: 0, boss: null, endT: 0, waveT: L.waveT, kills: 0, lost: 0, ground: null,
  };
  G.hq = spawn('hq', 210, 1000);
  G.sarge = spawn('sarge', 340, 1000, { slot: 0, ammo: [Infinity, 8, 160, 4], regenT: 0 });
  carry.squad.forEach((t, i) => { const a = i * 2.4; spawn(t, 300 + Math.cos(a) * 60, 1000 + Math.sin(a) * 60); });
  G.bunkers = L.bunkers.map(([x, y]) => {
    const b = spawn('bunker', x, y, { spawnT: rand(2, L.spawnRate), kids: 0 });
    for (let i = 0; i < L.guards; i++) {
      const a = rand(0, TAU);
      spawnTan(b, pickMix(L.mix, Math.random), x + Math.cos(a) * 90, y + Math.sin(a) * 90, false);
    }
    return b;
  });
  if (L.boss) {
    G.boss = spawn('boss', L.boss[0], L.boss[1], { home: { x: L.boss[0], y: L.boss[1] }, shield: true, phaseT: 4, attack: null, atkT: 0, charge: 0 });
  }
  genObstacles(rng, L);
  G.ground = renderGround(L.theme, rng);
  G.cam.x = G.sarge.x; G.cam.y = G.sarge.y;
  banner(L.name, L.brief, 4.5);
  commandMode = false; moveStick = aimStick = null;
  state = 'play';
}

function pickMix(mix, r) {
  let x = r(), acc = 0;
  for (const [t, w] of mix) { acc += w; if (x <= acc) return t; }
  return mix[0][0];
}
function spawnTan(bunker, type, x, y, raider) {
  const u = spawn(type, x, y, { home: { x: bunker.x, y: bunker.y }, raider, src: bunker.id, wanderT: 0, wx: x, wy: y });
  bunker.kids = (bunker.kids || 0) + 1;
  return u;
}

// ---------- obstacles & ground ----------
function genObstacles(rng, L) {
  const kinds = {
    grass: ['rock', 'crate', 'block', 'sandbag', 'crate', 'rock'],
    tile: ['block', 'crate', 'pencil', 'block', 'crate', 'block'],
    sand: ['rock', 'crate', 'sandbag', 'block', 'crate', 'sandbag'],
  }[L.theme];
  const blockCols = ['#d63c32', '#2f6fd6', '#f2c230', '#e8772a', '#8a3fc2', '#e9e9e9'];
  const protect = [{ x: 210, y: 1000, r: 260 }, ...L.bunkers.map(([x, y]) => ({ x, y, r: 210 }))];
  if (L.boss) protect.push({ x: L.boss[0], y: L.boss[1], r: 260 });
  const add = (o) => {
    for (const p of protect) {
      const cx = clamp(p.x, o.x, o.x + o.w), cy = clamp(p.y, o.y, o.y + o.h);
      if (Math.hypot(p.x - cx, p.y - cy) < p.r) return false;
    }
    for (const q of G.obs) {
      if (o.x < q.x + q.w + 40 && o.x + o.w + 40 > q.x && o.y < q.y + q.h + 40 && o.y + o.h + 40 > q.y) return false;
    }
    G.obs.push(o); return true;
  };
  let tries = 0, placed = 0;
  while (placed < L.obstacles && tries < 3000) {
    tries++;
    const kind = kinds[Math.floor(rng() * kinds.length)];
    let w, h, hp = null;
    if (kind === 'block') { w = 50 + Math.floor(rng() * 3) * 22; h = 40 + Math.floor(rng() * 2) * 22; if (rng() < 0.5) [w, h] = [h, w]; }
    else if (kind === 'crate') { w = h = 38 + Math.floor(rng() * 2) * 10; hp = 60; }
    else if (kind === 'rock') { w = 50 + rng() * 60; h = 40 + rng() * 50; }
    else if (kind === 'sandbag') { w = 100; h = 28; hp = 180; if (rng() < 0.5) [w, h] = [h, w]; }
    else if (kind === 'pencil') { w = 240; h = 22; if (rng() < 0.5) [w, h] = [h, w]; }
    const o = { kind, x: 80 + rng() * (WORLD_W - 160 - w), y: 80 + rng() * (WORLD_H - 160 - h), w, h, hp, maxHp: hp,
      color: blockCols[Math.floor(rng() * blockCols.length)], seed: rng() };
    if (add(o)) placed++;
  }
  // sandbag walls guarding each bunker (facing the player's side)
  for (const [bx, by] of L.bunkers) {
    for (let i = -1; i <= 1; i++) {
      const a = Math.PI + i * 0.75;
      const cx = bx + Math.cos(a) * 125, cy = by + Math.sin(a) * 125;
      const vert = Math.abs(Math.cos(a)) > 0.6;
      const w = vert ? 28 : 90, h = vert ? 90 : 28;
      G.obs.push({ kind: 'sandbag', x: cx - w / 2, y: cy - h / 2, w, h, hp: 180, maxHp: 180, seed: Math.random() });
    }
  }
}

function renderGround(theme, rng) {
  const c = document.createElement('canvas');
  c.width = WORLD_W / 2; c.height = WORLD_H / 2;
  const g = c.getContext('2d');
  g.scale(0.5, 0.5);
  if (theme === 'grass') {
    g.fillStyle = '#5a8a37'; g.fillRect(0, 0, WORLD_W, WORLD_H);
    for (let i = 0; i < 260; i++) {
      g.fillStyle = `hsla(${85 + rng() * 25},${35 + rng() * 20}%,${28 + rng() * 14}%,0.35)`;
      g.beginPath(); g.ellipse(rng() * WORLD_W, rng() * WORLD_H, 30 + rng() * 120, 20 + rng() * 80, rng() * 3, 0, TAU); g.fill();
    }
    for (let i = 0; i < 18; i++) {
      g.fillStyle = 'rgba(120,90,50,0.35)';
      g.beginPath(); g.ellipse(rng() * WORLD_W, rng() * WORLD_H, 40 + rng() * 90, 25 + rng() * 50, rng() * 3, 0, TAU); g.fill();
    }
    g.lineWidth = 2;
    for (let i = 0; i < 9000; i++) {
      const x = rng() * WORLD_W, y = rng() * WORLD_H;
      g.strokeStyle = rng() < 0.5 ? 'rgba(40,80,20,0.45)' : 'rgba(140,190,90,0.35)';
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + rng() * 6 - 3, y - 6 - rng() * 6); g.stroke();
    }
  } else if (theme === 'tile') {
    const s = 140;
    for (let y = 0; y < WORLD_H; y += s) for (let x = 0; x < WORLD_W; x += s) {
      const odd = ((x + y) / s) % 2;
      g.fillStyle = odd ? '#e9e1cc' : '#cfc3a4'; g.fillRect(x, y, s, s);
      g.fillStyle = 'rgba(0,0,0,0.04)'; g.fillRect(x + s * rng(), y + s * rng(), 20, 20);
    }
    g.strokeStyle = '#a89d84'; g.lineWidth = 4;
    for (let x = 0; x <= WORLD_W; x += s) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, WORLD_H); g.stroke(); }
    for (let y = 0; y <= WORLD_H; y += s) { g.beginPath(); g.moveTo(0, y); g.lineTo(WORLD_W, y); g.stroke(); }
    for (let i = 0; i < 12; i++) { // spills & crumbs
      g.fillStyle = rng() < 0.5 ? 'rgba(120,70,30,0.18)' : 'rgba(200,60,40,0.12)';
      g.beginPath(); g.ellipse(rng() * WORLD_W, rng() * WORLD_H, 30 + rng() * 70, 20 + rng() * 50, rng() * 3, 0, TAU); g.fill();
    }
    for (let i = 0; i < 400; i++) { g.fillStyle = 'rgba(150,110,60,0.5)'; g.fillRect(rng() * WORLD_W, rng() * WORLD_H, 3 + rng() * 4, 3 + rng() * 3); }
  } else {
    g.fillStyle = '#dcc08a'; g.fillRect(0, 0, WORLD_W, WORLD_H);
    for (let i = 0; i < 200; i++) {
      g.fillStyle = `rgba(${150 + rng() * 60},${120 + rng() * 40},${70 + rng() * 30},0.25)`;
      g.beginPath(); g.ellipse(rng() * WORLD_W, rng() * WORLD_H, 40 + rng() * 140, 20 + rng() * 60, rng() * 3, 0, TAU); g.fill();
    }
    g.strokeStyle = 'rgba(160,125,70,0.35)'; g.lineWidth = 3;
    for (let i = 0; i < 160; i++) {
      const x = rng() * WORLD_W, y = rng() * WORLD_H, l = 60 + rng() * 120;
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + l / 2, y - 12, x + l, y); g.stroke();
    }
    for (let i = 0; i < 5000; i++) { g.fillStyle = rng() < 0.5 ? 'rgba(255,240,200,0.5)' : 'rgba(120,90,50,0.4)'; g.fillRect(rng() * WORLD_W, rng() * WORLD_H, 2, 2); }
  }
  // the "edge of the battlefield"
  g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 24; g.strokeRect(0, 0, WORLD_W, WORLD_H);
  return c;
}

// ---------- utility for game logic ----------
function banner(title, sub, t = 3) { G.banner = { title, sub, t, max: t }; }
function floatText(x, y, txt, col) { G.texts.push({ x, y, txt, col, t: 1.2 }); }
function squad() { return G.units.filter(u => u.team === 'g' && !u.dead && RECRUITS.includes(u.type)); }
function cmdUnits() {
  const s = squad();
  if (G.sel.size === 0) return s;
  const sel = s.filter(u => G.sel.has(u.id));
  return sel.length ? sel : s;
}
function inRect(x, y, o) { return x >= o.x && x <= o.x + o.w && y >= o.y && y <= o.y + o.h; }
function collideObs(u) {
  for (const o of G.obs) {
    const cx = clamp(u.x, o.x, o.x + o.w), cy = clamp(u.y, o.y, o.y + o.h);
    const dx = u.x - cx, dy = u.y - cy, d2 = dx * dx + dy * dy;
    if (d2 < u.r * u.r) {
      if (d2 > 1e-4) { const d = Math.sqrt(d2); u.x += dx / d * (u.r - d); u.y += dy / d * (u.r - d); }
      else {
        const l = u.x - o.x, r = o.x + o.w - u.x, t = u.y - o.y, b = o.y + o.h - u.y, m = Math.min(l, r, t, b);
        if (m === l) u.x = o.x - u.r; else if (m === r) u.x = o.x + o.w + u.r; else if (m === t) u.y = o.y - u.r; else u.y = o.y + o.h + u.r;
      }
    }
  }
  u.x = clamp(u.x, u.r + 6, WORLD_W - u.r - 6); u.y = clamp(u.y, u.r + 6, WORLD_H - u.r - 6);
}
function steer(u, tx, ty, dt, sp) {
  const dx = tx - u.x, dy = ty - u.y, d = Math.hypot(dx, dy);
  if (d < 5) return true;
  let a = Math.atan2(dy, dx);
  if (u.detourT > 0) { u.detourT -= dt; a += u.detourDir * 1.25; }
  const step = Math.min(d, sp * dt), ox = u.x, oy = u.y;
  u.x += Math.cos(a) * step; u.y += Math.sin(a) * step;
  collideObs(u);
  const moved = Math.hypot(u.x - ox, u.y - oy);
  if (moved < step * 0.35) { u.stuck += dt; if (u.stuck > 0.25) { u.detourT = 0.6 + Math.random() * 0.5; u.detourDir = Math.random() < 0.5 ? -1 : 1; u.stuck = 0; } }
  else u.stuck = Math.max(0, u.stuck - dt);
  u.moving = true;
  u.a = lerpAngle(u.a, Math.atan2(u.y - oy, u.x - ox) || u.a, Math.min(1, dt * 10));
  return false;
}
function findTarget(u, range) {
  let best = null, bd = Infinity;
  for (const o of G.units) {
    if (o.dead || o.team === u.team) continue;
    const d = dist(u, o) - o.r;
    if (d < range && d < bd) { bd = d; best = o; }
  }
  return best;
}

// ---------- combat ----------
function fire(u, wkey, tx, ty, extra) {
  const W = WEAP[wkey];
  const base = Math.atan2(ty - u.y, tx - u.x);
  const a = base + rand(-(W.spread || 0), W.spread || 0);
  const off = u.r + (u.type === 't_tank' ? 16 : u.type === 'boss' ? 6 : 6);
  const mx = u.x + Math.cos(a) * off, my = u.y + Math.sin(a) * off;
  if (W.kind === 'grenade') {
    const d = Math.min(Math.hypot(tx - u.x, ty - u.y), W.range);
    G.bullets.push({ kind: 'grenade', team: u.team, sx: mx, sy: my, tx: u.x + Math.cos(base) * d, ty: u.y + Math.sin(base) * d, t: 0, dur: 0.35 + d / 900, dmg: W.dmg, splash: W.splash, x: mx, y: my });
  } else {
    const b = { kind: W.kind, x: mx, y: my, vx: Math.cos(a) * W.spd, vy: Math.sin(a) * W.spd, life: W.life || W.range / W.spd * 1.1,
      maxLife: W.life || W.range / W.spd * 1.1, team: u.team, dmg: W.dmg, splash: W.splash || 0, hits: W.kind === 'flame' ? new Set() : null };
    if (extra) Object.assign(b, extra);
    G.bullets.push(b);
  }
  if (W.kind === 'bullet') addPart({ x: mx, y: my, vx: 0, vy: 0, life: 0.06, size: 7, col: '#ffe48a', type: 'flash' });
  if (W.kind === 'rocket' || W.kind === 'shell') for (let i = 0; i < 5; i++) addPart({ x: mx, y: my, vx: rand(-40, 40), vy: rand(-40, 40), life: 0.5, size: rand(5, 9), col: '#bbb', type: 'smoke' });
  sfx(W.snd, u.x, u.y);
}

function damage(u, amt, fromTeam) {
  if (u.dead) return;
  if (u.type === 'boss' && u.shield) {
    if (Math.random() < 0.3) { addPart({ x: u.x + rand(-30, 30), y: u.y + rand(-30, 30), vx: 0, vy: 0, life: 0.3, size: 10, col: '#7fe8ff', type: 'flash' }); sfx('shield', u.x, u.y); }
    return;
  }
  u.hp -= amt; u.flash = 0.08; u.lastHit = G.time;
  if (u === G.sarge) { G.sarge.regenT = 4; if (amt > 5) sfx('hurt'); }
  if (u.hp <= 0) kill(u);
}

function kill(u) {
  u.dead = true;
  if (u.team === 't') {
    G.kills++;
    const b = u.T.bounty || 0;
    if (b) { G.plastic += b; floatText(u.x, u.y - 20, '+' + b, '#bff27a'); }
    const src = G.units.find(x => x.id === u.src); if (src) src.kids--;
    if (!u.T.building && u.type !== 'boss') {
      const r = Math.random();
      if (r < 0.1) G.pickups.push({ x: u.x, y: u.y, kind: 'hp', t: 25 });
      else if (r < 0.18) G.pickups.push({ x: u.x, y: u.y, kind: 'ammo', t: 25 });
    }
  } else if (RECRUITS.includes(u.type)) { G.lost++; G.sel.delete(u.id); }

  if (u.T.building || u.type === 'boss' || u.type === 't_tank') {
    const big = u.type !== 't_tank';
    explodeFx(u.x, u.y, big ? 110 : 70, true);
    if (big) for (let i = 0; i < 6; i++) setTimeout(() => G && explodeFx(u.x + rand(-60, 60), u.y + rand(-60, 60), 60, false), 150 * i);
    G.decals.push({ x: u.x, y: u.y, kind: 'scorch', r: u.r * 1.8, t: 60 });
    G.decals.push({ x: u.x, y: u.y, kind: 'rubble', r: u.r, t: 60, team: u.team, type: u.type });
  } else {
    G.decals.push({ x: u.x, y: u.y, kind: 'fallen', a: rand(0, TAU), team: u.team, r: u.r, t: 18, wtype: u.T.weapon });
    for (let i = 0; i < 6; i++) addPart({ x: u.x, y: u.y, vx: rand(-90, 90), vy: rand(-90, 90), life: 0.5, size: 3, col: COL[u.team].body, type: 'debris' });
  }

  if (u.type === 'bunker') {
    const left = G.bunkers.filter(b => !b.dead).length;
    if (left > 0) banner('Bunker destroyed!', left + ' remaining', 2.5);
    else if (G.boss && !G.boss.dead) { G.boss.shield = false; banner('SHIELD DOWN!', 'The Tan Overlord is vulnerable. Take him out!', 3.5); sfx('alarm'); }
  }
  if (u.type === 'boss') banner('THE OVERLORD HAS FALLEN!', 'Plastic justice is served.', 4);
  if (u === G.sarge) {
    G.lives--;
    if (G.lives > 0 && !G.hq.dead) { G.respawn = 4; banner('Sarge is down!', 'Redeploying from HQ...', 3); }
    else { G.endT = 2.5; G.result = 'over'; G.reason = G.hq.dead ? 'HQ destroyed' : 'Sarge is out of lives'; }
  }
  if (u === G.hq) { G.endT = 2.5; G.result = 'over'; G.reason = 'Your HQ was destroyed'; banner('HQ DESTROYED', '', 3); }
}

function explode(x, y, R, dmg, team) {
  for (const u of G.units) {
    if (u.dead || u.team === team) continue;
    const d = Math.max(0, dist(u, { x, y }) - u.r);
    if (d < R) {
      damage(u, dmg * (1 - 0.6 * d / R), team);
      if (!u.T.building && u.type !== 'boss' && !u.dead) {
        const a = Math.atan2(u.y - y, u.x - x); u.x += Math.cos(a) * 12; u.y += Math.sin(a) * 12; collideObs(u);
      }
    }
  }
  for (const o of G.obs) {
    if (o.hp == null) continue;
    const cx = clamp(x, o.x, o.x + o.w), cy = clamp(y, o.y, o.y + o.h);
    if (Math.hypot(x - cx, y - cy) < R) damageObs(o, dmg);
  }
  explodeFx(x, y, R, false);
}
function explodeFx(x, y, R, big) {
  const n = big ? 40 : 18;
  addPart({ x, y, vx: 0, vy: 0, life: 0.35, size: R, col: '#fff3b0', type: 'ring' });
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(40, big ? 320 : 200);
    addPart({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.25, 0.6), size: rand(6, big ? 22 : 14), col: Math.random() < 0.5 ? '#ffb430' : '#ff6a1f', type: 'fire' });
  }
  for (let i = 0; i < n / 2; i++) addPart({ x: x + rand(-R / 3, R / 3), y: y + rand(-R / 3, R / 3), vx: rand(-30, 30), vy: rand(-50, -10), life: rand(0.8, 1.6), size: rand(12, 26), col: '#555', type: 'smoke' });
  G.decals.push({ x, y, kind: 'scorch', r: R * 0.6, t: 25 });
  const cd = Math.hypot(x - G.cam.x, y - G.cam.y);
  G.shake = Math.min(22, G.shake + (big ? 16 : 7) * clamp(1 - cd / 900, 0, 1));
  sfx(big ? 'bigboom' : 'boom', x, y);
}
function damageObs(o, dmg) {
  if (o.hp == null || o.dead) return;
  o.hp -= dmg; o.flash = 0.08;
  if (o.hp <= 0) {
    o.dead = true;
    const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
    const col = o.kind === 'crate' ? '#a8743c' : '#9a8f62';
    for (let i = 0; i < 14; i++) addPart({ x: cx + rand(-o.w / 2, o.w / 2), y: cy + rand(-o.h / 2, o.h / 2), vx: rand(-150, 150), vy: rand(-150, 150), life: rand(0.4, 0.8), size: rand(3, 7), col, type: 'debris' });
    if (o.kind === 'crate') {
      const r = Math.random();
      G.pickups.push({ x: cx, y: cy, kind: r < 0.35 ? 'ammo' : r < 0.65 ? 'hp' : 'plastic', t: 30 });
    }
  }
}
const MAX_PARTS = 900;
function addPart(p) { if (G.parts.length < MAX_PARTS) { p.max = p.life; G.parts.push(p); } }

// ---------- player commands ----------
function recruit(type) {
  const T = TYPES[type];
  if (G.hq.dead) return;
  if (squad().length >= MAX_SQUAD) { banner('', 'Squad is at max size (' + MAX_SQUAD + ')', 1.5); sfx('deny'); return; }
  if (G.plastic < T.cost) { banner('', 'Need ' + T.cost + ' plastic for a ' + T.name, 1.5); sfx('deny'); return; }
  G.plastic -= T.cost;
  const a = rand(-1, 1);
  const u = spawn(type, G.hq.x + Math.cos(a) * 70, G.hq.y + Math.sin(a) * 70);

}
function orderFollow() {
  for (const u of cmdUnits()) u.order = { type: 'follow' };
  if (G.sarge && !G.sarge.dead) G.pings.push({ x: G.sarge.x, y: G.sarge.y, t: 0.6, col: '#9ef06a' });
  sfx('order');
}
function orderHold() {
  for (const u of cmdUnits()) u.order = { type: 'hold', x: u.x, y: u.y };
  sfx('order');
}
function rightClick() {
  let wx = mouse.wx, wy = mouse.wy;
  const mm = minimapRect(), lx = mouse.x / HS, ly = mouse.y / HS;
  if (lx >= mm.x && lx <= mm.x + mm.w && ly >= mm.y && ly <= mm.y + mm.h) {
    wx = (lx - mm.x) / mm.w * WORLD_W; wy = (ly - mm.y) / mm.h * WORLD_H;
  }
  orderAt(wx, wy);
}
function orderAt(wx, wy) {
  const units = cmdUnits();
  if (!units.length) return;
  let tgt = null;
  for (const o of G.units) if (!o.dead && o.team === 't' && Math.hypot(o.x - wx, o.y - wy) < o.r + 12) tgt = o;
  if (tgt) {
    for (const u of units) u.order = u.type === 'medic' ? { type: 'follow' } : { type: 'attack', target: tgt };
    G.pings.push({ x: tgt.x, y: tgt.y, t: 0.6, col: '#ff5a3c' });
  } else {
    const n = units.length, cols = Math.ceil(Math.sqrt(n));
    units.forEach((u, i) => {
      const ox = (i % cols - (cols - 1) / 2) * 30, oy = (Math.floor(i / cols) - (Math.ceil(n / cols) - 1) / 2) * 30;
      u.order = { type: 'move', x: clamp(wx + ox, 20, WORLD_W - 20), y: clamp(wy + oy, 20, WORLD_H - 20) };
    });
    G.pings.push({ x: wx, y: wy, t: 0.6, col: '#9ef06a' });
  }
  sfx('order');
}
function finishDrag() {
  const d = mouse.drag;
  const x0 = Math.min(d.x, mouse.wx), x1 = Math.max(d.x, mouse.wx), y0 = Math.min(d.y, mouse.wy), y1 = Math.max(d.y, mouse.wy);
  G.sel.clear();
  if (x1 - x0 < 6 && y1 - y0 < 6) {
    // shift-click: pick single unit or clear selection
    for (const u of squad()) if (Math.hypot(u.x - d.x, u.y - d.y) < u.r + 6) G.sel.add(u.id);
  } else {
    for (const u of squad()) if (u.x >= x0 && u.x <= x1 && u.y >= y0 && u.y <= y1) G.sel.add(u.id);
  }
  if (G.sel.size) sfx('order');
}
function cycleWeapon(dir) { const s = G.sarge; s.slot = (s.slot + dir + 4) % 4; }

// ---------- update ----------
const SARGE_SLOTS = [
  { w: 's_rifle', name: 'Rifle', icon: 'rifle' },
  { w: 's_bazooka', name: 'Bazooka', icon: 'bazooka' },
  { w: 's_flamer', name: 'Flamer', icon: 'flamer' },
  { w: 's_grenade', name: 'Grenade', icon: 'grenade' },
];

function update(dt) {
  G.time += dt;
  // camera
  const s = G.sarge;
  const focus = !s.dead ? s : G.hq;
  let leadX = 0, leadY = 0;
  if (!s.dead && !touchMode) { leadX = (mouse.x - VW / 2) / Z * 0.22; leadY = (mouse.y - VH / 2) / Z * 0.22; }
  else if (!s.dead) { leadX = Math.cos(s.a) * 90; leadY = Math.sin(s.a) * 90; }
  G.cam.x += (focus.x + leadX - G.cam.x) * Math.min(1, dt * 6);
  G.cam.y += (focus.y + leadY - G.cam.y) * Math.min(1, dt * 6);
  const hw = VW / 2 / Z, hh = VH / 2 / Z;
  G.cam.x = WORLD_W < hw * 2 ? WORLD_W / 2 : clamp(G.cam.x, hw, WORLD_W - hw);
  G.cam.y = WORLD_H < hh * 2 ? WORLD_H / 2 : clamp(G.cam.y, hh, WORLD_H - hh);
  mouse.wx = (mouse.x - VW / 2) / Z + G.cam.x;
  mouse.wy = (mouse.y - VH / 2) / Z + G.cam.y;
  G.shake = Math.max(0, G.shake - dt * 40);

  updateSarge(dt);

  // respawn
  if (s.dead && G.respawn > 0) {
    G.respawn -= dt;
    if (G.respawn <= 0 && !G.hq.dead) {
      s.dead = false; s.hp = s.maxHp; s.x = G.hq.x + 80; s.y = G.hq.y; s.ammo[1] = Math.max(s.ammo[1], 4); s.ammo[3] = Math.max(s.ammo[3], 2);
      G.units.push(s); G.pings.push({ x: s.x, y: s.y, t: 0.8, col: '#9ef06a' });
    }
  }

  // tan attack waves
  G.waveT -= dt;
  if (G.waveT <= 0) {
    G.waveT = G.L.waveT;
    const live = G.bunkers.filter(b => !b.dead);
    if (live.length) {
      banner('', '⚠ Tan attack wave incoming!', 2.5); sfx('alarm');
      for (const b of live) for (let i = 0; i < 2 + G.idx; i++) {
        const a = rand(0, TAU); spawnTan(b, pickMix(G.L.mix, Math.random), b.x + Math.cos(a) * 60, b.y + Math.sin(a) * 60, true);
      }
    }
  }

  // follower slot assignment
  const followers = G.units.filter(u => u.team === 'g' && !u.dead && u.order.type === 'follow' && RECRUITS.includes(u.type));
  followers.forEach((u, i) => { u.slotIdx = i; u.slotN = followers.length; });

  for (const u of G.units) {
    if (u.dead || u === G.sarge) continue;
    u.cd -= dt; u.flash -= dt; u.moving = false; u.anim += dt;
    if (u.type === 'hq') buildingAI(u, dt);
    else if (u.type === 'bunker') { buildingAI(u, dt); bunkerSpawn(u, dt); }
    else if (u.type === 'boss') bossAI(u, dt);
    else if (u.team === 'g') squadAI(u, dt);
    else tanAI(u, dt);
  }
  separate();

  updateBullets(dt);

  // particles
  for (const p of G.parts) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === 'debris' || p.type === 'fire') { p.vx *= 0.92; p.vy *= 0.92; }
    if (p.type === 'smoke') { p.vx *= 0.97; p.vy *= 0.97; }
  }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const d of G.decals) d.t -= dt;
  G.decals = G.decals.filter(d => d.t > 0);
  if (G.decals.length > 220) G.decals.splice(0, G.decals.length - 220);
  for (const t of G.texts) { t.t -= dt; t.y -= 30 * dt; }
  G.texts = G.texts.filter(t => t.t > 0);
  for (const p of G.pings) p.t -= dt;
  G.pings = G.pings.filter(p => p.t > 0);
  for (const o of G.obs) if (o.flash > 0) o.flash -= dt;
  G.obs = G.obs.filter(o => !o.dead);

  // pickups
  for (const p of G.pickups) {
    p.t -= dt;
    if (!s.dead && Math.hypot(p.x - s.x, p.y - s.y) < 28) {
      p.t = 0; sfx('pickup');
      if (p.kind === 'hp') { s.hp = Math.min(s.maxHp, s.hp + 70); floatText(p.x, p.y, '+70 HP', '#ff8a8a'); }
      else if (p.kind === 'ammo') { s.ammo[1] += 4; s.ammo[2] += 80; s.ammo[3] += 2; floatText(p.x, p.y, 'AMMO!', '#ffd76a'); }
      else { G.plastic += 35; floatText(p.x, p.y, '+35 plastic', '#bff27a'); }
    }
  }
  G.pickups = G.pickups.filter(p => p.t > 0);

  G.units = G.units.filter(u => !u.dead);

  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }

  // win / lose
  if (!G.result && G.bunkers.every(b => b.dead) && (!G.boss || G.boss.dead)) { G.result = 'win'; G.endT = 2.5; }
  if (G.result) {
    G.endT -= dt;
    if (G.endT <= 0) {
      if (G.result === 'win') {
        carry = { plastic: G.plastic + 100, squad: squad().map(u => u.type) };
        state = G.idx === LEVELS.length - 1 ? 'victory' : 'levelwin';
        sfx('win');
      } else { state = 'over'; sfx('lose'); }
    }
  }
}

function updateSarge(dt) {
  const s = G.sarge;
  if (s.dead) return;
  s.cd -= dt; s.flash -= dt; s.anim += dt;
  let mx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  let my = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  let l = Math.hypot(mx, my), spMul = 1;
  const mv = stickVec(moveStick);
  if (mv && mv.mag > 0.15) { mx = mv.dx; my = mv.dy; l = Math.hypot(mx, my); spMul = Math.min(1, mv.mag * 1.25); }
  s.moving = l > 0;
  if (l) {
    const sp = TYPES.sarge.speed * (s.slot === 1 ? 0.85 : 1) * spMul;
    s.x += mx / l * sp * dt; s.y += my / l * sp * dt; collideObs(s);
  }
  const slot = SARGE_SLOTS[s.slot], W = WEAP[slot.w];
  let aimX = mouse.wx, aimY = mouse.wy, wantFire = mouse.left;
  if (touchMode) {
    const av = stickVec(aimStick);
    wantFire = false;
    if (av && av.mag > 0.2) {
      const a = Math.atan2(av.dy, av.dx);
      const reach = slot.w === 's_grenade' ? W.range * clamp(av.mag, 0.3, 1) : W.range * 0.9;
      aimX = s.x + Math.cos(a) * reach; aimY = s.y + Math.sin(a) * reach;
      // aim assist: snap to the closest enemy inside a narrow cone
      let best = null, bs = Infinity;
      for (const o of G.units) {
        if (o.dead || o.team !== 't') continue;
        const d = dist(s, o) - o.r;
        if (d > W.range) continue;
        const da = Math.abs(lerpAngle(a, Math.atan2(o.y - s.y, o.x - s.x), 1) - a);
        if (da < 0.4 && d + da * 300 < bs) { bs = d + da * 300; best = o; }
      }
      if (best) { aimX = best.x; aimY = best.y; }
      wantFire = true;
    } else if (l) { aimX = s.x + mx / l * 100; aimY = s.y + my / l * 100; }
    else { aimX = s.x + Math.cos(s.a) * 100; aimY = s.y + Math.sin(s.a) * 100; }
  }
  s.a = Math.atan2(aimY - s.y, aimX - s.x);
  if (wantFire && s.cd <= 0) {
    if (s.ammo[s.slot] > 0) {
      fire(s, slot.w, aimX, aimY);
      s.cd = WEAP[slot.w].cd; s.ammo[s.slot]--;
    } else { s.cd = 0.4; sfx('deny'); floatText(s.x, s.y - 24, 'Out of ' + slot.name + ' ammo!', '#ffd76a'); }
  }
  s.regenT -= dt;
  if (s.regenT <= 0 && s.hp < s.maxHp) s.hp = Math.min(s.maxHp, s.hp + 6 * dt);
}

function shootAt(u, t, wkey) {
  const W = WEAP[wkey];
  u.ta = Math.atan2(t.y - u.y, t.x - u.x);
  if (u.type !== 't_tank') u.a = lerpAngle(u.a, u.ta, 0.5);
  if (u.cd <= 0) { fire(u, wkey, t.x + rand(-4, 4), t.y + rand(-4, 4)); u.cd = W.cd * rand(0.85, 1.15); }
}

function squadAI(u, dt) {
  const W = WEAP[u.T.weapon];
  const s = G.sarge;
  if (u.type === 'medic') return medicAI(u, dt);
  u.retarget -= dt;
  if (u.retarget <= 0) {
    u.retarget = 0.25 + Math.random() * 0.15;
    if (u.order.type === 'attack') {
      if (!u.order.target || u.order.target.dead) u.order = { type: 'hold', x: u.x, y: u.y };
      else u.target = u.order.target;
    }
    if (u.order.type !== 'attack') u.target = findTarget(u, u.T.sight);
  }
  if (u.target && u.target.dead) u.target = null;
  let anchor, leash;
  if (u.order.type === 'follow') {
    const lead = !s.dead ? s : G.hq;
    const i = u.slotIdx || 0, n = u.slotN || 1;
    const ring = Math.floor(i / 7), idx = i % 7, cnt = Math.min(7, n - ring * 7);
    const fa = (!s.dead ? s.a : 0) + Math.PI + (idx - (cnt - 1) / 2) * 0.5;
    const rr = 62 + ring * 36;
    anchor = { x: lead.x + Math.cos(fa) * rr, y: lead.y + Math.sin(fa) * rr };
    leash = 240;
  } else if (u.order.type === 'move' || u.order.type === 'hold') { anchor = { x: u.order.x, y: u.order.y }; leash = 160; }
  else { anchor = u.target || u; leash = 1e9; }

  const t = u.target;
  let dest = anchor, inRange = false;
  if (t) {
    const d = dist(u, t) - t.r;
    inRange = d <= W.range * 0.92;
    if (d <= W.range) shootAt(u, t, u.T.weapon);
    if (u.order.type !== 'move') {
      if (inRange) dest = null;
      else if (dist(t, anchor) < leash + W.range) dest = t;
    }
  }
  if (dest) {
    const dd = Math.hypot(dest.x - u.x, dest.y - u.y);
    const close = dest === t ? 0 : (u.order.type === 'follow' ? 18 : 6);
    if (dd > close) steer(u, dest.x, dest.y, dt, u.T.speed * (u.order.type === 'follow' && dd > 160 ? 1.3 : 1));
  }
  if (u.order.type === 'move' && Math.hypot(u.order.x - u.x, u.order.y - u.y) < 12) u.order = { type: 'hold', x: u.order.x, y: u.order.y };
}

function medicAI(u, dt) {
  const s = G.sarge;
  u.retarget -= dt;
  if (u.retarget <= 0) {
    u.retarget = 0.3;
    let best = null, bv = 0.98;
    for (const o of G.units) {
      if (o.dead || o.team !== 'g' || o === u || o.T.building) continue;
      const f = o.hp / o.maxHp;
      if (f < bv && dist(u, o) < u.T.sight) { bv = f; best = o; }
    }
    u.target = best;
  }
  const t = u.target;
  if (t && !t.dead && t.hp < t.maxHp) {
    if (dist(u, t) > WEAP.heal.range - 10) steer(u, t.x, t.y, dt, u.T.speed);
    else {
      u.a = lerpAngle(u.a, Math.atan2(t.y - u.y, t.x - u.x), 0.3);
      if (u.cd <= 0) {
        u.cd = WEAP.heal.cd; t.hp = Math.min(t.maxHp, t.hp + WEAP.heal.heal);
        for (let i = 0; i < 4; i++) addPart({ x: t.x + rand(-8, 8), y: t.y + rand(-8, 8), vx: 0, vy: -40, life: 0.6, size: 4, col: '#7dff8a', type: 'plus' });
        sfx('heal', u.x, u.y);
      }
    }
    return;
  }
  let anchor;
  if (u.order.type === 'follow') { const lead = !s.dead ? s : G.hq; anchor = { x: lead.x - Math.cos(s.a || 0) * 40, y: lead.y - Math.sin(s.a || 0) * 40 }; }
  else anchor = { x: u.order.x, y: u.order.y };
  if (anchor.x !== undefined && Math.hypot(anchor.x - u.x, anchor.y - u.y) > 30) steer(u, anchor.x, anchor.y, dt, u.T.speed);
  if (u.order.type === 'move' && Math.hypot(u.order.x - u.x, u.order.y - u.y) < 12) u.order = { type: 'hold', x: u.order.x, y: u.order.y };
}

function tanAI(u, dt) {
  const W = WEAP[u.T.weapon];
  u.retarget -= dt;
  if (u.retarget <= 0) { u.retarget = 0.3 + Math.random() * 0.2; u.target = findTarget(u, u.T.sight); }
  if (u.target && u.target.dead) u.target = null;
  const t = u.target;
  const leash = u.raider ? 1e9 : 380;
  if (t) {
    const d = dist(u, t) - t.r;
    if (d <= W.range) shootAt(u, t, u.T.weapon);
    if (d > W.range * 0.85 && (u.raider || dist(t, u.home) < leash + W.range)) steer(u, t.x, t.y, dt, u.T.speed);
    else if (!u.raider && dist(u, u.home) > leash) steer(u, u.home.x, u.home.y, dt, u.T.speed);
  } else if (u.raider) {
    const goal = !G.hq.dead ? G.hq : G.sarge;
    steer(u, goal.x, goal.y, dt, u.T.speed);
  } else {
    u.wanderT -= dt;
    if (u.wanderT <= 0) { u.wanderT = rand(2, 5); const a = rand(0, TAU), r = rand(60, 220); u.wx = u.home.x + Math.cos(a) * r; u.wy = u.home.y + Math.sin(a) * r; }
    if (Math.hypot(u.wx - u.x, u.wy - u.y) > 10) steer(u, u.wx, u.wy, dt, u.T.speed * 0.5);
  }
  if (u.type === 't_tank' && !t) u.ta = lerpAngle(u.ta, u.a, dt * 3);
}

function buildingAI(u, dt) {
  u.retarget -= dt;
  if (u.retarget <= 0) { u.retarget = 0.4; u.target = findTarget(u, u.T.sight); }
  if (u.target && !u.target.dead) shootAt(u, u.target, u.T.weapon);
}
function bunkerSpawn(b, dt) {
  b.spawnT -= dt;
  if (b.spawnT <= 0) {
    b.spawnT = G.L.spawnRate * rand(0.8, 1.2);
    if (b.kids < G.L.cap) {
      const a = Math.PI + rand(-1.2, 1.2);
      spawnTan(b, pickMix(G.L.mix, Math.random), b.x + Math.cos(a) * 60, b.y + Math.sin(a) * 60, Math.random() < G.L.raid);
    }
  }
}

function bossAI(u, dt) {
  const s = G.sarge;
  const enraged = u.hp < u.maxHp * 0.4;
  u.retarget -= dt;
  if (u.retarget <= 0) { u.retarget = 0.4; u.target = findTarget(u, u.T.sight); }
  if (u.target && u.target.dead) u.target = null;
  const t = u.target;

  if (u.charge > 0) {
    u.charge -= dt;
    u.x += u.cvx * dt; u.y += u.cvy * dt; collideObs(u); u.moving = true;
    if (Math.random() < 0.6) addPart({ x: u.x + rand(-20, 20), y: u.y + rand(-20, 20), vx: 0, vy: 0, life: 0.6, size: 14, col: '#c9a873', type: 'smoke' });
    for (const o of G.units) {
      if (o.dead || o.team !== 'g' || o.T.building || u.chargeHit.has(o.id)) continue;
      if (dist(u, o) < u.r + o.r + 4) {
        u.chargeHit.add(o.id); damage(o, 45, 't');
        const a = Math.atan2(o.y - u.y, o.x - u.x); o.x += Math.cos(a) * 50; o.y += Math.sin(a) * 50; if (!o.dead) collideObs(o);
      }
    }
    return;
  }
  // movement
  const leash = u.shield ? 220 : 1e9;
  if (t) {
    u.a = lerpAngle(u.a, Math.atan2(t.y - u.y, t.x - u.x), 0.15);
    if (dist(u, t) > 200 && dist(t, u.home) < leash + 300) steer(u, t.x, t.y, dt, u.T.speed * (enraged ? 1.3 : 1));
    if (dist(u, t) < 330) shootAt(u, t, 't_mg');
  } else if (dist(u, u.home) > 30) steer(u, u.home.x, u.home.y, dt, u.T.speed);

  // special attacks
  u.phaseT -= dt * (enraged ? 1.6 : 1);
  if (u.attack) {
    u.atkT -= dt;
    if (u.attack === 'ring' && u.atkT <= 0) {
      u.atkT = 0.35; u.burst--;
      const off = rand(0, TAU);
      for (let i = 0; i < 18; i++) {
        const a = off + i / 18 * TAU;
        G.bullets.push({ kind: 'orb', x: u.x + Math.cos(a) * 36, y: u.y + Math.sin(a) * 36, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, life: 2.4, maxLife: 2.4, team: 't', dmg: 10, splash: 0 });
      }
      sfx('tshot', u.x, u.y);
      if (u.burst <= 0) u.attack = null;
    } else if (u.attack === 'rockets' && u.atkT <= 0) {
      u.atkT = 0.22; u.burst--;
      const tg = G.units.filter(o => !o.dead && o.team === 'g' && dist(o, u) < 750);
      const pick = tg.length ? tg[Math.floor(Math.random() * tg.length)] : null;
      if (pick) fire(u, 'b_rocket', pick.x, pick.y, { homing: pick, turn: 2.2 });
      if (u.burst <= 0) u.attack = null;
    }
    return;
  }
  if (u.phaseT <= 0 && t) {
    u.phaseT = rand(3.2, 4.5);
    const opts = ['ring', 'rockets', 'summon'];
    if (!u.shield) opts.push('charge', 'charge');
    const pick = opts[Math.floor(Math.random() * opts.length)];
    if (pick === 'ring') { u.attack = 'ring'; u.burst = enraged ? 4 : 3; u.atkT = 0.3; floatText(u.x, u.y - 50, 'BOW BEFORE ME!', '#ffd76a'); }
    else if (pick === 'rockets') { u.attack = 'rockets'; u.burst = enraged ? 7 : 5; u.atkT = 0.2; floatText(u.x, u.y - 50, 'ROCKET BARRAGE!', '#ffd76a'); }
    else if (pick === 'summon') {
      floatText(u.x, u.y - 50, 'MINIONS, ATTACK!', '#ffd76a'); sfx('alarm', u.x, u.y);
      for (let i = 0; i < (enraged ? 4 : 3); i++) {
        const a = rand(0, TAU);
        spawn(Math.random() < 0.3 ? 't_bazooka' : 't_rifle', u.x + Math.cos(a) * 70, u.y + Math.sin(a) * 70, { home: { x: u.x, y: u.y }, raider: true, wanderT: 0 });
      }
    } else if (pick === 'charge') {
      const tg = !s.dead ? s : t;
      const a = Math.atan2(tg.y - u.y, tg.x - u.x);
      u.charge = 0.9; u.cvx = Math.cos(a) * 420; u.cvy = Math.sin(a) * 420; u.chargeHit = new Set(); u.a = a;
      floatText(u.x, u.y - 50, 'CHARGE!', '#ffd76a');
    }
  }
}

function separate() {
  const us = G.units;
  for (let i = 0; i < us.length; i++) {
    const a = us[i]; if (a.dead) continue;
    for (let j = i + 1; j < us.length; j++) {
      const b = us[j]; if (b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
      if (Math.abs(dx) > rr || Math.abs(dy) > rr) continue;
      const d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr || d2 < 1e-6) continue;
      const d = Math.sqrt(d2), push = (rr - d), nx = dx / d, ny = dy / d;
      const aFix = a.T.building, bFix = b.T.building;
      if (aFix && bFix) continue;
      if (aFix) { b.x += nx * push; b.y += ny * push; }
      else if (bFix) { a.x -= nx * push; a.y -= ny * push; }
      else {
        const wa = a.type === 'boss' || a.type === 't_tank' ? 0.15 : 0.5, wb = 1 - wa;
        a.x -= nx * push * (b.type === 'boss' ? 0.9 : wa); a.y -= ny * push * (b.type === 'boss' ? 0.9 : wa);
        b.x += nx * push * (b.type === 'boss' ? 0.1 : wb); b.y += ny * push * (b.type === 'boss' ? 0.1 : wb);
      }
    }
  }
}

function updateBullets(dt) {
  for (const b of G.bullets) {
    if (b.kind === 'grenade') {
      b.t += dt;
      const k = Math.min(1, b.t / b.dur);
      b.x = b.sx + (b.tx - b.sx) * k; b.y = b.sy + (b.ty - b.sy) * k; b.z = Math.sin(k * Math.PI) * 60;
      if (b.t >= b.dur) { b.dead = true; explode(b.tx, b.ty, b.splash, b.dmg, b.team); }
      continue;
    }
    if (b.homing && !b.homing.dead) {
      const cur = Math.atan2(b.vy, b.vx), want = Math.atan2(b.homing.y - b.y, b.homing.x - b.x);
      const na = lerpAngle(cur, want, Math.min(1, b.turn * dt)), sp = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
    }
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.kind === 'rocket' || b.kind === 'shell') addPart({ x: b.x, y: b.y, vx: rand(-15, 15), vy: rand(-15, 15), life: 0.5, size: rand(4, 7), col: '#cfcfcf', type: 'smoke' });
    if (b.kind === 'flame') { b.vx *= 0.97; b.vy *= 0.97; }
    // obstacles
    for (const o of G.obs) {
      if (!inRect(b.x, b.y, o)) continue;
      if (b.kind === 'rocket' || b.kind === 'shell') explode(b.x, b.y, b.splash, b.dmg, b.team);
      else if (b.kind === 'flame') damageObs(o, b.dmg * 0.4);
      else { damageObs(o, b.dmg); for (let i = 0; i < 3; i++) addPart({ x: b.x, y: b.y, vx: rand(-80, 80), vy: rand(-80, 80), life: 0.2, size: 2, col: '#ffe9a0', type: 'spark' }); }
      b.dead = true; break;
    }
    if (b.dead) continue;
    // units
    for (const u of G.units) {
      if (u.dead || u.team === b.team) continue;
      const rr = u.r + (b.kind === 'flame' ? 8 : 3);
      if (dist2(u, b) > rr * rr) continue;
      if (b.kind === 'flame') {
        if (b.hits.has(u.id)) continue;
        b.hits.add(u.id); damage(u, b.dmg * (u.T.vehicle ? 0.6 : 1), b.team);
        if (Math.random() < 0.3) addPart({ x: u.x + rand(-6, 6), y: u.y + rand(-6, 6), vx: 0, vy: -30, life: 0.4, size: 6, col: '#ff8a2a', type: 'fire' });
        continue;
      }
      if (b.kind === 'rocket' || b.kind === 'shell') explode(b.x, b.y, b.splash, b.dmg, b.team);
      else {
        damage(u, b.dmg, b.team);
        for (let i = 0; i < 3; i++) addPart({ x: b.x, y: b.y, vx: rand(-60, 60), vy: rand(-60, 60), life: 0.25, size: 2.5, col: COL[u.team].light, type: 'spark' });
      }
      b.dead = true; break;
    }
    if (!b.dead && b.life <= 0) {
      b.dead = true;
      if (b.kind === 'rocket' || b.kind === 'shell') explode(b.x, b.y, b.splash, b.dmg, b.team);
    }
  }
  G.bullets = G.bullets.filter(b => !b.dead);
}

// ---------- drawing ----------
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

function drawSoldier(u, team, wtype, flashOn) {
  const c = COL[team], r = u.r;
  ctx.save(); ctx.translate(u.x, u.y);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ellipse(3, 5, r * 1.1, r * 0.75);
  // the classic plastic base
  ctx.fillStyle = c.dark; circle(0, 0, r);
  ctx.fillStyle = c.base; circle(-0.5, -1, r * 0.86);
  const bob = u.moving ? Math.sin(u.anim * 14) * 1.2 : 0;
  ctx.rotate(u.a);
  ctx.translate(bob * 0.5, 0);
  const body = flashOn ? '#fff' : c.body, light = flashOn ? '#fff' : c.light;
  // gear on back
  if (wtype === 'flamer' || wtype === 's_flamer') { ctx.fillStyle = '#6d6d6d'; circle(-r * 0.75, -r * 0.3, r * 0.32); circle(-r * 0.75, r * 0.3, r * 0.32); }
  else { ctx.fillStyle = c.dark; rrect(-r * 0.95, -r * 0.4, r * 0.45, r * 0.8, 2); ctx.fill(); }
  // weapon
  ctx.fillStyle = '#2b2b2b';
  if (wtype === 'bazooka' || wtype === 't_bazooka' || wtype === 's_bazooka') { ctx.fillStyle = team === 'g' ? '#34541f' : '#7a5f33'; rrect(-r * 0.7, r * 0.2, r * 2.1, r * 0.42, 2); ctx.fill(); ctx.fillStyle = '#222'; ctx.fillRect(r * 1.3, r * 0.17, 3, r * 0.48); }
  else if (wtype === 'flamer' || wtype === 's_flamer') { ctx.fillRect(r * 0.2, r * 0.15, r * 1.25, 3); ctx.fillStyle = '#ff8a2a'; circle(r * 1.5, r * 0.2, 1.8); }
  else if (wtype === 'heal') { /* medic carries no gun */ }
  else if (wtype === 's_grenade') { ctx.fillRect(r * 0.2, r * 0.2, r * 1.1, 3); ctx.fillStyle = '#3c5a26'; circle(r * 0.75, -r * 0.55, r * 0.25); }
  else { ctx.fillRect(r * 0.15, r * 0.18, r * 1.35, 3); }
  // shoulders + arms
  ctx.fillStyle = body; ellipse(0, 0, r * 0.5, r * 0.82);
  ctx.fillStyle = c.dark; ellipse(r * 0.35, r * 0.35, r * 0.28, r * 0.18);
  if (wtype !== 'heal') ellipse(r * 0.55, -r * 0.05, r * 0.28, r * 0.16);
  // helmet

function drawWorld() {
  const shx = rand(-G.shake, G.shake) * 0.5, shy = rand(-G.shake, G.shake) * 0.5;
  ctx.setTransform(DPR * Z, 0, 0, DPR * Z, DPR * (VW / 2 - G.cam.x * Z + shx), DPR * (VH / 2 - G.cam.y * Z + shy));
  const vx0 = G.cam.x - VW / 2 / Z - 60, vy0 = G.cam.y - VH / 2 / Z - 60, vx1 = G.cam.x + VW / 2 / Z + 60, vy1 = G.cam.y + VH / 2 / Z + 60;

  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(G.ground, 0, 0, WORLD_W, WORLD_H);

  // decals
  for (const d of G.decals) {
    if (!vis(d.x, d.y, 80)) continue;

    ctx.globalAlpha = a;
    if (d.kind === 'scorch') { ctx.fillStyle = 'rgba(30,20,10,0.35)'; circle(d.x, d.y, d.r); }
    else if (d.kind === 'fallen') {
      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.a);
      const c = COL[d.team];
      ctx.fillStyle = c.dark; ellipse(0, 0, d.r * 1.3, d.r * 0.55);
      ctx.fillStyle = c.base; ellipse(0, -1, d.r * 1.1, d.r * 0.42);
      ctx.fillStyle = c.light; circle(d.r * 0.9, 0, d.r * 0.38);
      ctx.restore();
    } else if (d.kind === 'rubble') {
      ctx.fillStyle = d.team === 'g' ? '#3b4a2a' : '#6d5a3a';
      for (let i = 0; i < 9; i++) { const aa = i * 0.7, rr = d.r * (0.3 + (i % 3) * 0.25); ctx.fillRect(d.x + Math.cos(aa) * rr - 6, d.y + Math.sin(aa) * rr - 5, 12, 10); }

  for (const p of G.pickups) {
    if (!vis(p.x, p.y)) continue;

    const bob = Math.sin(G.time * 4 + p.x) * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ellipse(p.x + 2, p.y + 6, 11, 5);
    if (p.kind === 'hp') { ctx.fillStyle = '#fff'; rrect(p.x - 10, p.y - 10 + bob, 20, 20, 4); ctx.fill(); ctx.fillStyle = '#d52f2f'; ctx.fillRect(p.x - 2.5, p.y - 7 + bob, 5, 14); ctx.fillRect(p.x - 7, p.y - 2.5 + bob, 14, 5); }
    else if (p.kind === 'ammo') { ctx.fillStyle = '#4c5a2b'; rrect(p.x - 12, p.y - 8 + bob, 24, 16, 3); ctx.fill(); ctx.fillStyle = '#ffd76a'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('AMMO', p.x, p.y + 3 + bob); }
    else { ctx.fillStyle = '#6fd13a'; circle(p.x, p.y + bob, 9); ctx.fillStyle = '#2d5a14'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('P', p.x, p.y + 4 + bob); }
  }

  // pings
  for (const p of G.pings) {
    const k = 1 - p.t / 0.6;
    ctx.strokeStyle = p.col; ctx.globalAlpha = Math.max(0, p.t / 0.6); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, 8 + k * 22, 0, TAU); ctx.stroke();

  ctx.globalAlpha = 1;

  for (const u of sorted) {

      ctx.fillStyle = '#c33'; ctx.beginPath(); ctx.moveTo(6, -3); ctx.lineTo(11, 0); ctx.lineTo(6, 3); ctx.fill();
      ctx.fillStyle = '#ffb430'; circle(-10, 0, 3 + Math.random() * 2);
      ctx.restore();
    } else if (b.kind === 'flame') {

  // drag box

}

}

  HS = hudScale();

  ctx.setTransform(DPR * HS, 0, 0, DPR * HS, 0, 0);
  hudButtons = [];
  const s = G.sarge;
  // top-left: mission
  const left = G.bunkers.filter(b => !b.dead).length;
  panel(12, 12, 300, 62);
  txt(`Mission ${G.idx + 1}: ${G.L.name}`, 24, 34, 15, '#e7f5c9');
  const obj = left ? `Bunkers remaining: ${left}/${G.bunkers.length}` : (G.boss && !G.boss.dead ? 'Defeat the Tan Overlord!' : 'Area secured!');
  txt(obj, 24, 56, 13, left ? '#ffd76a' : '#ff8a6a', 'left', false);
  if (left) txt(`Next wave ${Math.ceil(G.waveT)}s`, 300, 56, 12, '#c9d8b0', 'right', false);

  // top-right: resources
  panel(LW - 232, 12, 220, 62);
  ctx.fillStyle = '#6fd13a'; circle(LW - 210, 36, 9); txt('P', LW - 210, 40, 11, '#1f3d0e', 'center');
  txt(`${Math.floor(G.plastic)} plastic`, LW - 194, 41, 16, '#d9f7b5');
  txt(`Squad ${squad().length}/${MAX_SQUAD}${G.sel.size ? '  (' + G.sel.size + ' sel.)' : ''}`, LW - 222, 62, 12, '#c9d8b0', 'left', false);
  for (let i = 0; i < G.lives; i++) { ctx.fillStyle = '#79b347'; ctx.beginPath(); ctx.arc(LW - 30 - i * 18, 62, 7, Math.PI, 0); ctx.fill(); ctx.fillRect(LW - 39 - i * 18, 61, 18, 3); }

  // bottom-left: Sarge
  const bx = 12, by = LH - 104;
  panel(bx, by, 300, 92);
  txt('SARGE', bx + 12, by + 22, 13, '#ffd76a');
  hpBarHUD(bx + 70, by + 12, 218, 12, s.dead ? 0 : s.hp / s.maxHp);
  if (s.dead && G.respawn > 0) txt(`Redeploying in ${Math.ceil(G.respawn)}...`, bx + 179, by + 22, 11, '#fff', 'center');
  for (let i = 0; i < 4; i++) {
    const x = bx + 12 + i * 70, y = by + 34, w = 64, h = 48, on = s.slot === i;
    ctx.fillStyle = on ? 'rgba(120,180,70,0.45)' : 'rgba(255,255,255,0.06)'; rrect(x, y, w, h, 6); ctx.fill();
    if (on) { ctx.strokeStyle = '#b8ff7a'; ctx.lineWidth = 2; ctx.stroke(); }
    if (!touchMode) txt(String(i + 1), x + 6, y + 13, 10, '#c9d8b0', 'left', false);
    txt(SARGE_SLOTS[i].name, x + w / 2, y + 28, 12, on ? '#fff' : '#cfd9be', 'center');
    const am = s.ammo[i];
    txt(am === Infinity ? '∞' : String(Math.floor(am)), x + w / 2, y + 43, 12, am === 0 ? '#ff6a5a' : '#ffd76a', 'center');
    hudButtons.push({ x, y, w, h, fn: () => { s.slot = i; } });
  }

  // recruit buttons
  const mm = minimapRect();
  const recruitBtn = (t, x, y, bw) => {
    const T = TYPES[t], afford = G.plastic >= T.cost && !G.hq.dead;
    panel(x, y, bw, 52);
    if (!afford) { ctx.fillStyle = 'rgba(0,0,0,0.35)'; rrect(x, y, bw, 52, 8); ctx.fill(); }
    drawSoldier({ x: x + 22, y: y + 26, r: 11, a: -Math.PI / 2, moving: false, anim: 0 }, 'g', T.weapon, false);
    txt(T.name, x + 40, y + 21, 13, afford ? '#e7f5c9' : '#8a957a');
    txt(touchMode ? `${T.cost} plastic` : `[${T.key}]  ${T.cost}`, x + 40, y + 40, 12, afford ? '#9ef06a' : '#7a8a6a', 'left', false);
    hudButtons.push({ x, y, w: bw, h: 52, fn: () => recruit(t) });
  };
  if (touchMode) {
    const y0 = 96;
    txt('RECRUIT', 14, y0 - 6, 11, '#c9d8b0');
    RECRUITS.forEach((t, i) => recruitBtn(t, 12, y0 + i * 58, 124));
    // squad command buttons down the right edge
    const cx = LW - 42, cy0 = Math.max(mm.y + mm.h + 50, LH / 2 - 110);
    roundBtn(cx, cy0, 28, 'ORDER', commandMode, () => { commandMode = !commandMode; sfx('order'); });
    roundBtn(cx, cy0 + 66, 28, 'FOLLOW', false, orderFollow);
    roundBtn(cx, cy0 + 132, 28, 'GUARD', false, orderHold);
    roundBtn(cx - 66, cy0, 22, 'II', false, () => { state = 'paused'; moveStick = aimStick = null; });
    roundBtn(cx - 66, cy0 + 56, 22, '?', showHelp, () => { showHelp = !showHelp; });
  } else {
    const bw = 112, gap = 8, total = RECRUITS.length * bw + (RECRUITS.length - 1) * gap;
    let rx = Math.max(324, LW / 2 - total / 2);
    if (rx + total > mm.x - 10) rx = Math.max(324, mm.x - 10 - total);
    const ry = LH - 66;
    if (rx + total < mm.x) {
      txt('RECRUIT AT HQ', rx, ry - 8, 11, '#c9d8b0', 'left', true);
      RECRUITS.forEach((t, i) => recruitBtn(t, rx + i * (bw + gap), ry, bw));
    }
  }

  // minimap
  panel(mm.x - 4, mm.y - 4, mm.w + 8, mm.h + 8);
  const sx = mm.w / WORLD_W, sy = mm.h / WORLD_H;
  ctx.fillStyle = G.L.theme === 'grass' ? '#3f6a28' : G.L.theme === 'tile' ? '#9c917a' : '#b39a66';
  ctx.fillRect(mm.x, mm.y, mm.w, mm.h);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  for (const o of G.obs) ctx.fillRect(mm.x + o.x * sx, mm.y + o.y * sy, Math.max(1.5, o.w * sx), Math.max(1.5, o.h * sy));
  for (const u of G.units) {
    const big = u.T.building || u.type === 'boss';
    ctx.fillStyle = u === s ? '#fff36a' : u.team === 'g' ? '#7dff4a' : (u.type === 'boss' ? '#ff3a3a' : '#ffb04a');
    const r = big ? 4 : u === s ? 3 : 1.8;
    ctx.fillRect(mm.x + u.x * sx - r, mm.y + u.y * sy - r, r * 2, r * 2);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
  ctx.strokeRect(mm.x + (G.cam.x - VW / 2 / Z) * sx, mm.y + (G.cam.y - VH / 2 / Z) * sy, VW / Z * sx, VH / Z * sy);

  // boss bar
  if (G.boss && !G.boss.dead) {
    const room = LW - 680;
    const w = room > 200 ? Math.min(460, room) : Math.min(460, LW * 0.5), x = LW / 2 - w / 2, y = room > 200 ? 18 : 84;
    panel(x - 10, y - 6, w + 20, 46);
    txt('TAN OVERLORD' + (G.boss.shield ? '  —  SHIELDED' : ''), LW / 2, y + 12, 13, G.boss.shield ? '#7fe8ff' : '#ffcf33', 'center');
    ctx.fillStyle = '#300'; ctx.fillRect(x, y + 20, w, 12);
    ctx.fillStyle = G.boss.shield ? '#5fb8cc' : '#d43a2a'; ctx.fillRect(x, y + 20, w * G.boss.hp / G.boss.maxHp, 12);
  }

  // banner
  if (G.banner) {
    const b = G.banner, a = Math.min(1, b.t * 2, (b.max - b.t) * 4 + 0.2);
    ctx.globalAlpha = a;
    if (b.title) txt(b.title, LW / 2, LH * 0.28, 38, '#f2ffd9', 'center');
    if (b.sub) txt(b.sub, LW / 2, LH * 0.28 + (b.title ? 34 : 0), 18, '#ffe9a0', 'center');
    ctx.globalAlpha = 1;
  }
  if (commandMode) txt('Tap the battlefield to move your squad, or tap an enemy to attack it', LW / 2, LH * 0.28 + 70, 16, '#b8ff7a', 'center');
  if (!touchMode) txt('H: help   P: pause   M: ' + (muted ? 'unmute' : 'mute'), 14, 92, 11, 'rgba(230,245,210,0.6)', 'left', false);
  else if (VH > VW) txt('Tip: turn your phone sideways for a bigger view', LW / 2, LH - 120, 14, '#ffe9a0', 'center');
  if (showHelp) drawHelp(LW, LH);

  // virtual sticks (screen space)
  if (touchMode) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    for (const st of [moveStick, aimStick]) {
      if (!st) continue;
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; circle(st.sx, st.sy, STICK_R);
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(st.sx, st.sy, STICK_R, 0, TAU); ctx.stroke();
      ctx.fillStyle = st === aimStick ? 'rgba(255,190,90,0.6)' : 'rgba(184,255,122,0.55)'; circle(st.x, st.y, 26);
    }
  }
}
function hpBarHUD(x, y, w, h, f) {
  ctx.fillStyle = '#2a1a14'; rrect(x, y, w, h, 4); ctx.fill();
  ctx.fillStyle = f > 0.5 ? '#6fd13a' : f > 0.25 ? '#e8c23a' : '#e04a3a'; rrect(x, y, Math.max(0, w * f), h, 4); ctx.fill();
}
function hudClick(sx, sy) {
  const x = sx / HS, y = sy / HS;
  for (const b of hudButtons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return true; }
  const mm = minimapRect();
  if (x >= mm.x && x <= mm.x + mm.w && y >= mm.y && y <= mm.y + mm.h) {
    if (touchMode) { orderAt((x - mm.x) / mm.w * WORLD_W, (y - mm.y) / mm.h * WORLD_H); commandMode = false; }
    return true;
  }
  return false;
}

const HELP = [
  ['SARGE (you)', ''],
  ['WASD / Arrows', 'Move'],
  ['Mouse + Left click', 'Aim & fire'],
  ['1-4 / Wheel', 'Rifle · Bazooka · Flamer · Grenade'],
  ['SQUAD', ''],
  ['Z X C V', 'Recruit Rifleman · Bazooka · Flamer · Medic'],
  ['Right click ground', 'Move squad there (they hold & defend)'],
  ['Right click enemy', 'Focus attack target'],
  ['Right click minimap', 'Send squad anywhere'],
  ['Space', 'Squad: follow Sarge'],
  ['G', 'Squad: guard current spot'],
  ['Shift + drag', 'Select part of the squad (Q = all)'],
  ['TIPS', ''],
  ['', 'Kill tan troops & smash crates for plastic and ammo.'],
  ['', 'Bunkers keep spawning minions — take them out!'],
  ['', 'Sarge slowly heals when out of combat. Medics heal everyone.'],
];
const HELP_TOUCH = [
  ['SARGE (you)', ''],
  ['Left thumb', 'Drag anywhere on the left half to move'],
  ['Right thumb', 'Drag on the right half to aim & fire'],
  ['', 'Aim assist locks onto enemies near your aim.'],
  ['Weapon boxes', 'Tap to switch Rifle · Bazooka · Flamer · Grenade'],
  ['SQUAD', ''],
  ['Recruit buttons', 'Spend plastic to get new soldiers at HQ'],
  ['ORDER', 'Then tap the ground to send the squad there,'],
  ['', 'or tap an enemy to make them all attack it'],
  ['Minimap', 'Tap it to send the squad anywhere'],
  ['FOLLOW / GUARD', 'Squad follows Sarge / holds its spot'],
  ['TIPS', ''],
  ['', 'Kill tan troops & smash crates for plastic and ammo.'],
  ['', 'Bunkers keep spawning minions — take them out!'],
];
function drawHelp(LW, LH) {
  const list = touchMode ? HELP_TOUCH : HELP;
  const w = Math.min(560, LW - 40), h = list.length * 24 + 40, x = LW / 2 - w / 2, y = LH / 2 - h / 2;
  panel(x, y, w, h);
  list.forEach(([k, v], i) => {
    const yy = y + 32 + i * 24;
    if (!v) { txt(k, x + 20, yy, 14, '#ffd76a'); return; }
    txt(k, x + 20, yy, 13, '#e7f5c9'); txt(v, x + (k || touchMode ? 180 : 20), yy, 13, '#c9d8b0', 'left', false);
  });
}

// ---------- screens ----------
let titleArmy = null;
function drawTitle(dt) {
  titleT += dt;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const grd = ctx.createLinearGradient(0, 0, 0, VH);
  grd.addColorStop(0, '#3d6326'); grd.addColorStop(1, '#22361a');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, VW, VH);
  if (!titleArmy) {
    titleArmy = [];
    for (let i = 0; i < 14; i++) titleArmy.push({ x: rand(-200, VW), y: VH * 0.78 + rand(-30, 40), r: 12, a: 0, moving: true, anim: rand(0, 6), team: 'g', w: ['rifle', 'bazooka', 'flamer', 'rifle'][i % 4], sp: rand(40, 55) });
    for (let i = 0; i < 10; i++) titleArmy.push({ x: rand(0, VW + 200), y: VH * 0.2 + rand(-30, 40), r: 12, a: Math.PI, moving: true, anim: rand(0, 6), team: 't', w: i % 3 ? 't_rifle' : 't_bazooka', sp: -rand(30, 45) });
  }
  for (const s of titleArmy) {
    s.x += s.sp * dt; s.anim += dt;
    if (s.sp > 0 && s.x > VW + 40) s.x = -40; if (s.sp < 0 && s.x < -40) s.x = VW + 40;
    drawSoldier(s, s.team, s.w, false);
  }
  const pulse = 1 + Math.sin(titleT * 2) * 0.02;
  ctx.save(); ctx.translate(VW / 2, VH * 0.38); ctx.scale(pulse, pulse);
  txt('PLASTIC FRONT', 0, 0, Math.min(84, VW / 9), '#d6ffb0', 'center');
  ctx.restore();
  txt('Green vs. Tan', VW / 2, VH * 0.38 + 44, 24, '#ffe08a', 'center');
  txt(VW < 700 ? 'Lead the green army men against the Tan Overlord!' : 'Lead your little green army men against the evil Tan Overlord and his minions.', VW / 2, VH * 0.38 + 84, VW < 700 ? 14 : 16, '#e7f5c9', 'center', false);
  txt(touchMode ? 'Left thumb moves · Right thumb aims & fires · Tap buttons to recruit and command' : 'WASD move · Mouse aim/fire · 1-4 weapons · Z/X/C/V recruit · Right-click command squad · H help', VW / 2, VH * 0.38 + 112, VW < 700 ? 11 : 13, '#c9d8b0', 'center', false);
  if (Math.floor(titleT * 2) % 2 === 0) txt(touchMode ? 'Tap to deploy' : 'Click or press Enter to deploy', VW / 2, VH * 0.38 + 160, 22, '#fff', 'center');
  txt('Keyboard + mouse, or touch (landscape works best)', VW / 2, VH - 20, 12, 'rgba(230,245,210,0.55)', 'center', false);
}
function drawOverlay(title, lines, prompt, col) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = 'rgba(10,14,8,0.72)'; ctx.fillRect(0, 0, VW, VH);
  txt(title, VW / 2, VH * 0.35, Math.min(60, VW / 12), col, 'center');
  lines.forEach((l, i) => txt(l, VW / 2, VH * 0.35 + 50 + i * 28, VW < 700 ? 13 : 18, '#e7f5c9', 'center', false));
  if (prompt && Math.floor(performance.now() / 500) % 2 === 0) txt(touchMode ? prompt.replace('Click', 'Tap') : prompt, VW / 2, VH * 0.35 + 70 + lines.length * 28, 20, '#fff', 'center');
}
function onClickOverlay() {
  if (state === 'title') { carry = { plastic: 120, squad: ['rifle', 'rifle'] }; newLevel(0); }
  else if (state === 'levelwin') newLevel(G.idx + 1);
  else if (state === 'over') { carry = { plastic: levelStartCarry.plastic, squad: levelStartCarry.squad.slice() }; newLevel(G.idx); }
  else if (state === 'victory') { state = 'title'; G = null; titleArmy = null; }
  else if (state === 'paused') state = 'play';
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (state === 'title') drawTitle(dt);
  else {
    if (state === 'play') update(dt);
    drawWorld(); drawHUD();
    const mins = Math.floor(G.time / 60), secs = String(Math.floor(G.time % 60)).padStart(2, '0');
    if (state === 'paused') drawOverlay('PAUSED', [touchMode ? 'Tap to resume' : 'Press P or Esc to resume'], null, '#d6ffb0');
    else if (state === 'levelwin') drawOverlay('MISSION COMPLETE', [`Tan troops destroyed: ${G.kills}   ·   Squad lost: ${G.lost}   ·   Time ${mins}:${secs}`, `Surviving squad members and plastic carry over (+100 bonus plastic).`, `Next: ${LEVELS[G.idx + 1].name}`], 'Click to continue', '#b8ff7a');
    else if (state === 'over') drawOverlay('MISSION FAILED', [G.reason || '', 'The tan menace grows stronger...'], 'Click to retry mission', '#ff7a5a');
    else if (state === 'victory') drawOverlay('VICTORY!', ['The Tan Overlord is melted down into a puddle.', `Final mission: ${G.kills} tan troops destroyed in ${mins}:${secs}.`, 'The backyard is safe — for now.'], 'Click to return to the title', '#ffe08a');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// small debug hook for automated testing
window.__pf = { get G() { return G; }, get state() { return state; }, newLevel, setState: s => { state = s; } };
</script>
