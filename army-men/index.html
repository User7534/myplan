   a squad of little green army men against the Tan Overlord.

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = innerWidth; VH = innerHeight;
  cvs.width = VW * DPR; cvs.height = VH * DPR;
  cvs.style.width = VW + 'px'; cvs.style.height = VH + 'px';

// ---------- helpers ----------
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const dist2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };
function lerpAngle(a, b, t) { let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let WORLD_W = 3000, WORLD_H = 2000;

// ---------- audio (synthesised, no files) ----------
let AC = null, master = null, noiseBuf = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function noise(dur, freq, type, vol, delay = 0) {
  const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function tone(f1, f2, dur, type, vol, delay = 0) {
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
const sfxLast = {};
function sfx(name, x, y) {
  if (!AC || muted) return;
  let v = 1;
  if (x !== undefined && G) { const d = Math.hypot(x - G.cam.x, y - G.cam.y); v = clamp(1 - d / 1200, 0, 1); if (v < 0.03) return; }
  const now = AC.currentTime, gap = name === 'flame' ? 0.09 : 0.035;
  if (sfxLast[name] && now - sfxLast[name] < gap) return; sfxLast[name] = now;
  switch (name) {
    case 'shot': noise(0.07, 2600, 'bandpass', 0.28 * v); tone(800, 200, 0.05, 'square', 0.03 * v); break;
    case 'tshot': noise(0.08, 1700, 'bandpass', 0.2 * v); break;
    case 'rocket': noise(0.35, 700, 'lowpass', 0.25 * v); tone(320, 110, 0.3, 'sawtooth', 0.05 * v); break;
    case 'cannon': noise(0.3, 400, 'lowpass', 0.45 * v); tone(140, 50, 0.25, 'square', 0.08 * v); break;
    case 'boom': noise(0.6, 520, 'lowpass', 0.7 * v); tone(120, 30, 0.5, 'sine', 0.5 * v); break;
    case 'bigboom': noise(1.4, 300, 'lowpass', 1 * v); tone(80, 20, 1.2, 'sine', 0.7 * v); break;
    case 'flame': noise(0.16, 1100, 'lowpass', 0.14 * v); break;
    case 'shotgun': noise(0.2, 1400, 'lowpass', 0.5 * v); tone(180, 60, 0.12, 'square', 0.06 * v); break;
    case 'sniper': noise(0.12, 3200, 'bandpass', 0.45 * v); tone(1400, 200, 0.18, 'square', 0.05 * v); break;
    case 'mortar': tone(220, 70, 0.3, 'sine', 0.35 * v); noise(0.15, 600, 'lowpass', 0.25 * v); break;
    case 'engine': tone(90, 140, 0.25, 'sawtooth', 0.05); break;
    case 'throw': tone(500, 950, 0.12, 'triangle', 0.08 * v); break;
    case 'pickup': tone(600, 1200, 0.1, 'square', 0.06); tone(900, 1800, 0.12, 'square', 0.05, 0.08); break;
    case 'recruit': tone(400, 800, 0.12, 'square', 0.07); tone(600, 1200, 0.12, 'square', 0.06, 0.1); break;
    case 'deny': tone(220, 150, 0.2, 'square', 0.08); break;
    case 'hurt': tone(320, 90, 0.18, 'sawtooth', 0.1); break;
    case 'alarm': tone(700, 420, 0.35, 'square', 0.06); tone(700, 420, 0.35, 'square', 0.06, 0.4); break;
    case 'shield': tone(1300, 1700, 0.07, 'sine', 0.06 * v); break;
    case 'heal': tone(900, 1400, 0.15, 'sine', 0.05 * v); break;
    case 'order': tone(500, 650, 0.06, 'square', 0.05); break;
    case 'win': [0, 0.15, 0.3, 0.5].forEach((d, i) => tone([523, 659, 784, 1046][i], [523, 659, 784, 1046][i], 0.3, 'square', 0.07, d)); break;
    case 'lose': [0, 0.25, 0.5].forEach((d, i) => tone([392, 330, 262][i], [392, 330, 220][i], 0.4, 'square', 0.07, d)); break;
  }
}

// ---------- input ----------
const keys = {};
const mouse = { x: 0, y: 0, wx: 0, wy: 0, left: false, right: false, drag: null };
addEventListener('keydown', e => {
  if (['Space', 'Tab', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  padMode = false;
  if (!keys[e.code]) onKeyPress(e);
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.left = false; });
cvs.addEventListener('contextmenu', e => e.preventDefault());
cvs.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cvs.addEventListener('mousedown', e => {
  initAudio();
  touchMode = false; padMode = false;
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (e.button === 0) {
    if (state === 'title') { hudClick(mouse.x, mouse.y); return; }
    if (state !== 'play') { onClickOverlay(); return; }
    if (hudClick(mouse.x, mouse.y)) return;
    if (e.shiftKey) { mouse.drag = { x: mouse.wx, y: mouse.wy }; return; }
    mouse.left = true;
  } else if (e.button === 2) {
    if (state === 'play') rightClick();
  }
});
addEventListener('mouseup', e => {
  if (e.button === 0) {
    mouse.left = false;
    if (mouse.drag && state === 'play') finishDrag();
    mouse.drag = null;
  }
});
cvs.addEventListener('wheel', e => {
  if (state !== 'play' || !G.sarge) return;
  e.preventDefault();
  cycleWeapon(e.deltaY > 0 ? 1 : -1);
}, { passive: false });

// ---- touch ----
cvs.addEventListener('touchstart', e => {
  e.preventDefault();
  initAudio();
  touchMode = true;
  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY;
    if (state === 'title') { hudClick(x, y); return; }
    if (state !== 'play') { onClickOverlay(); return; }
    padMode = false;
    if (hudClick(x, y)) continue;
    if (commandMode) { orderAt((x - VW / 2) / Z + G.cam.x, (y - VH / 2) / Z + G.cam.y); commandMode = false; continue; }
    const st = { id: t.identifier, sx: x, sy: y, x, y };
    if (x < VW / 2) { if (!moveStick) moveStick = st; }
    else if (!aimStick) aimStick = st;
  }
}, { passive: false });
cvs.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    for (const st of [moveStick, aimStick]) if (st && st.id === t.identifier) { st.x = t.clientX; st.y = t.clientY; }
  }
}, { passive: false });
function endTouch(e) {
  e.preventDefault();
  initAudio();
  for (const t of e.changedTouches) {

function stickVec(st) {

// ---- gamepad (Xbox / standard mapping) ----
// 0 A, 1 B, 2 X, 3 Y, 4 LB, 5 RB, 6 LT, 7 RT, 8 View, 9 Menu, 12-15 D-pad up/down/left/right
let padMode = false, pad = null, padPrev = [], padAimA = 0, recruitCursor = 0, activePad = null;
addEventListener('gamepadconnected', () => { if (G && state === 'play') banner('', 'Controller connected — press any button', 2); });
function pollPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];

  activePad = gp;

  const prev = padPrev;
  const pressed = i => now[i] && !prev[i];
  const ax = i => { const v = gp.axes[i] || 0; return Math.abs(v) < 0.2 ? 0 : v; };
  pad = { lx: ax(0), ly: ax(1), rx: ax(2), ry: ax(3), rt: !!now[7], lt: !!now[6] };
  const any = now.some(Boolean) || pad.lx || pad.ly || pad.rx || pad.ry;
  if (any && !padMode) { padMode = true; touchMode = false; }
  if (now.some(Boolean)) initAudio();
  padPrev = now;
  if (!padMode) return;

  if (pressed(4)) cycleWeapon(-1);

function rumble(strong, weak, ms) {

}
function padOrder() {
  const s = G.sarge; if (s.dead) return;

function onKeyPress(e) {
  initAudio();
  if (e.code === 'KeyM') { muted = !muted; return; }
  if (state === 'title') {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') setDifficulty(diffIdx - 1);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') setDifficulty(diffIdx + 1);
    if (e.code === 'ArrowUp' || e.code === 'KeyW') setMission(missionSel - 1);
    if (e.code === 'ArrowDown' || e.code === 'KeyS') setMission(missionSel + 1);
    if (e.code === 'Enter' || e.code === 'Space') deploy();
    if (e.code === 'KeyR') openManual();
    return;
  }
  if (state === 'levelwin' || state === 'over' || state === 'victory') {
    if (e.code === 'Enter' || e.code === 'Space') onClickOverlay();
    return;
  }
  if (e.code === 'Escape' || e.code === 'KeyP') { state = state === 'paused' ? 'play' : 'paused'; return; }
  if (state === 'paused') return;
  if (e.code === 'KeyH') { showHelp = !showHelp; return; }
  if (e.code.startsWith('Digit')) { const n = +e.code.slice(5) - 1; if (n >= 0 && n < SARGE_SLOTS.length) G.sarge.slot = n; }
  if (e.code === 'KeyE' || e.code === 'KeyF') toggleVehicle();
  const ri = RECRUITS.findIndex(t => 'Key' + TYPES[t].key === e.code);
  if (ri >= 0) recruit(RECRUITS[ri]);

  if (e.code === 'KeyG') orderHold();

// ---------- game state ----------
let state = 'title';

let showHelp = false;
// starting resources; jumping straight to a later mission brings a bigger squad

let carry = START_CARRY();
let levelStartCarry = null;
let UID = 1;
let hudButtons = [];
let titleT = 0;

function spawn(type, x, y, extra) {

function newLevel(idx) {
  const L = LEVELS[idx];

  levelStartCarry = { plastic: carry.plastic, squad: carry.squad.slice() };
  G = {
    L, idx, units: [], bullets: [], parts: [], obs: [], pickups: [], decals: [], texts: [], pings: [],
    time: 0, shake: 0, plastic: carry.plastic, lives: DIFF().lives, cam: { x: 400, y: 1000 }, sel: new Set(), mines: [], outposts: [],
    banner: null, respawn: 0, boss: null, endT: 0, waveT: L.waveT * DIFF().wave, kills: 0, lost: 0, ground: null,
  };

  carry.squad.forEach((t, i) => { const a = i * 2.4, rr = TYPES[t].vehicle ? 120 : 60; spawn(t, 450 + Math.cos(a) * rr, midY + Math.sin(a) * rr); });
  G.bunkers = L.bunkers.map(([fx, fy]) => {

    for (let i = 0; i < L.guards; i++) {

function pickMix(mix, r) {

function spawnTan(bunker, type, x, y, raider) {

// ---------- obstacles & ground ----------
function genObstacles(rng, L) {
  const kinds = {
    grass: ['rock', 'crate', 'block', 'sandbag', 'crate', 'rock'],
    tile: ['block', 'crate', 'pencil', 'block', 'crate', 'block'],
    concrete: ['tire', 'crate', 'block', 'sandbag', 'crate', 'tire', 'rock'],
    sand: ['rock', 'crate', 'sandbag', 'block', 'crate', 'sandbag'],
    carpet: ['book', 'block', 'crate', 'block', 'crate', 'book', 'tire'],
    bedroom: ['sock', 'crayon', 'book', 'block', 'crate', 'sock', 'block'],
    desert: ['cactus', 'mesa', 'crate', 'rock', 'cactus', 'sandbag'],
    mountain: ['pine', 'rock', 'pine', 'crate', 'rock', 'pine'],
    tundra: ['shrub', 'rock', 'crate', 'shrub', 'sandbag', 'rock'],
    arctic: ['ice', 'drift', 'crate', 'ice', 'drift', 'rock'],
  }[L.theme];
  const blockCols = ['#d63c32', '#2f6fd6', '#f2c230', '#e8772a', '#8a3fc2', '#e9e9e9'];
  const hq = { x: 330, y: WORLD_H / 2 };
  const bpos = L.bunkers.map(([fx, fy]) => ({ x: fx * WORLD_W, y: fy * WORLD_H }));
  const protect = [{ ...hq, r: 300 }, ...bpos.map(b => ({ ...b, r: 210 }))];
  if (L.boss) protect.push({ x: L.boss[0] * WORLD_W, y: L.boss[1] * WORLD_H, r: 280 });
  const add = (o) => {
    for (const p of protect) {
      const cx = clamp(p.x, o.x, o.x + o.w), cy = clamp(p.y, o.y, o.y + o.h);
      if (Math.hypot(p.x - cx, p.y - cy) < p.r) return false;
    }
    for (const q of G.obs) {
      if (o.x < q.x + q.w + 50 && o.x + o.w + 50 > q.x && o.y < q.y + q.h + 50 && o.y + o.h + 50 > q.y) return false;
    }
    G.obs.push(o); return true;
  };
  let tries = 0, placed = 0;
  while (placed < L.obstacles && tries < 9000) {
    tries++;
    const kind = kinds[Math.floor(rng() * kinds.length)];
    let w, h, hp = null;
    if (kind === 'block') { w = 50 + Math.floor(rng() * 3) * 22; h = 40 + Math.floor(rng() * 2) * 22; if (rng() < 0.5) [w, h] = [h, w]; }
    else if (kind === 'crate') { w = h = 38 + Math.floor(rng() * 2) * 10; hp = 60; }
    else if (kind === 'rock') { w = 50 + rng() * 60; h = 40 + rng() * 50; }
    else if (kind === 'sandbag') { w = 100; h = 28; hp = 180; if (rng() < 0.5) [w, h] = [h, w]; }
    else if (kind === 'pencil') { w = 240; h = 22; if (rng() < 0.5) [w, h] = [h, w]; }
    else if (kind === 'tire') { w = h = 56 + Math.floor(rng() * 2) * 16; }
    else if (kind === 'book') { w = 150 + rng() * 90; h = 105 + rng() * 50; if (rng() < 0.5) [w, h] = [h, w]; }
    else if (kind === 'sock') { w = 130 + rng() * 40; h = 46; if (rng() < 0.5) [w, h] = [h, w]; }
    else if (kind === 'crayon') { w = 200; h = 24; if (rng() < 0.5) [w, h] = [h, w]; }
    else if (kind === 'cactus') { w = h = 40 + Math.floor(rng() * 2) * 12; hp = 90; }
    else if (kind === 'mesa') { w = 130 + rng() * 110; h = 100 + rng() * 70; }
    else if (kind === 'pine') { w = h = 58 + Math.floor(rng() * 3) * 12; }
    else if (kind === 'shrub') { w = h = 42 + Math.floor(rng() * 2) * 12; hp = 80; }
    else if (kind === 'ice') { w = 60 + rng() * 60; h = 50 + rng() * 50; hp = 250; }
    else if (kind === 'drift') { w = 130 + rng() * 90; h = 60 + rng() * 40; if (rng() < 0.4) [w, h] = [h, w]; }
    const palette = kind === 'book' ? ['#3b5b8c', '#8c3b3b', '#3b7a4a', '#c99a2e', '#4a3b6b']
      : kind === 'sock' ? ['#d9534f', '#4a7fd6', '#f0c419', '#6cc070', '#9b59b6', '#e8e8e8']
      : kind === 'crayon' ? ['#e03c31', '#2f6fd6', '#2e9e4a', '#f2c230', '#8a3fc2', '#ff7f27'] : blockCols;
    const o = { kind, x: 80 + rng() * (WORLD_W - 160 - w), y: 80 + rng() * (WORLD_H - 160 - h), w, h, hp, maxHp: hp,
      color: palette[Math.floor(rng() * palette.length)], seed: rng() };
    if (add(o)) placed++;
  }
  // mountain ridges: short boulder chains that funnel movement (always short enough to walk around)
  for (let r = 0; r < (L.ridges || 0); r++) {
    let x = WORLD_W * (0.18 + rng() * 0.72), y = WORLD_H * (0.1 + rng() * 0.8);
    const a = Math.PI / 2 + (rng() - 0.5) * 1.2, n = 4 + Math.floor(rng() * 4);
    for (let i = 0; i < n; i++) {
      const sz = 90 + rng() * 50;
      const o = { kind: 'rock', x: x - sz / 2, y: y - sz / 2, w: sz, h: sz * (0.75 + rng() * 0.3), hp: null, seed: rng() };
      const blocked = protect.some(p => Math.hypot(p.x - x, p.y - y) < p.r + sz);
      if (!blocked && o.x > 40 && o.y > 40 && o.x + o.w < WORLD_W - 40 && o.y + o.h < WORLD_H - 40) G.obs.push(o);
      x += Math.cos(a) * sz * 0.85; y += Math.sin(a) * sz * 0.85;
    }
  }
  // sandbag walls guarding each bunker, facing the player's HQ
  for (const b of bpos) {
    const face = Math.atan2(hq.y - b.y, hq.x - b.x);
    for (let i = -1; i <= 1; i++) {
      const a = face + i * 0.75;
      const cx = b.x + Math.cos(a) * 125, cy = b.y + Math.sin(a) * 125;
      const vert = Math.abs(Math.cos(a)) > 0.6;
      const w = vert ? 28 : 90, h = vert ? 90 : 28;
      G.obs.push({ kind: 'sandbag', x: cx - w / 2, y: cy - h / 2, w, h, hp: 180, maxHp: 180, seed: Math.random() });
    }
  }
}

function renderGround(theme, rng) {
  const c = document.createElement('canvas');
  const f = WORLD_W * WORLD_H > 2.5e7 ? 1 / 3 : 1 / 2; // coarser texture for huge maps keeps memory in check
  c.width = Math.ceil(WORLD_W * f); c.height = Math.ceil(WORLD_H * f);
  const g = c.getContext('2d');
  g.scale(f, f);
  const k = WORLD_W * WORLD_H / 6e6; // detail scales with map area
  const blobs = (n, style, rx, ry) => {
    for (let i = 0; i < n * k; i++) {
      g.fillStyle = style();
      g.beginPath(); g.ellipse(rng() * WORLD_W, rng() * WORLD_H, rx[0] + rng() * rx[1], ry[0] + rng() * ry[1], rng() * 3, 0, TAU); g.fill();
    }
  };
  if (theme === 'grass') {
    g.fillStyle = '#5a8a37'; g.fillRect(0, 0, WORLD_W, WORLD_H);
    blobs(260, () => `hsla(${85 + rng() * 25},${35 + rng() * 20}%,${28 + rng() * 14}%,0.35)`, [30, 120], [20, 80]);
    blobs(18, () => 'rgba(120,90,50,0.35)', [40, 90], [25, 50]);
    g.lineWidth = 2;
    for (let i = 0; i < 9000 * k; i++) {
      const x = rng() * WORLD_W, y = rng() * WORLD_H;
      g.strokeStyle = rng() < 0.5 ? 'rgba(40,80,20,0.45)' : 'rgba(140,190,90,0.35)';
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + rng() * 6 - 3, y - 6 - rng() * 6); g.stroke();
    }
  } else if (theme === 'tile') {
    const s = 140;
    for (let y = 0; y < WORLD_H; y += s) for (let x = 0; x < WORLD_W; x += s) {
      const odd = ((x + y) / s) % 2;
      g.fillStyle = odd ? '#e9e1cc' : '#cfc3a4'; g.fillRect(x, y, s, s);
      g.fillStyle = 'rgba(0,0,0,0.04)'; g.fillRect(x + s * rng(), y + s * rng(), 20, 20);
    }
    g.strokeStyle = '#a89d84'; g.lineWidth = 4;
    for (let x = 0; x <= WORLD_W; x += s) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, WORLD_H); g.stroke(); }
    for (let y = 0; y <= WORLD_H; y += s) { g.beginPath(); g.moveTo(0, y); g.lineTo(WORLD_W, y); g.stroke(); }
    blobs(12, () => rng() < 0.5 ? 'rgba(120,70,30,0.18)' : 'rgba(200,60,40,0.12)', [30, 70], [20, 50]);
    for (let i = 0; i < 400 * k; i++) { g.fillStyle = 'rgba(150,110,60,0.5)'; g.fillRect(rng() * WORLD_W, rng() * WORLD_H, 3 + rng() * 4, 3 + rng() * 3); }
  } else if (theme === 'concrete') {
    g.fillStyle = '#8f908a'; g.fillRect(0, 0, WORLD_W, WORLD_H);
    blobs(220, () => `rgba(${100 + rng() * 60},${100 + rng() * 60},${95 + rng() * 55},0.25)`, [40, 140], [20, 70]);
    blobs(30, () => 'rgba(25,22,20,0.35)', [30, 80], [20, 50]); // oil stains
    g.strokeStyle = 'rgba(60,60,55,0.5)'; g.lineWidth = 4;
    for (let x = 450; x < WORLD_W; x += 450) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, WORLD_H); g.stroke(); }
    for (let y = 450; y < WORLD_H; y += 450) { g.beginPath(); g.moveTo(0, y); g.lineTo(WORLD_W, y); g.stroke(); }
    g.fillStyle = 'rgba(240,200,40,0.7)'; // painted parking lines
    for (let i = 0; i < 10 * k; i++) { const x = rng() * WORLD_W, y = rng() * WORLD_H; for (let j = 0; j < 4; j++) g.fillRect(x + j * 120, y, 10, 160); }
    g.strokeStyle = 'rgba(40,40,38,0.5)'; g.lineWidth = 2; // cracks
    for (let i = 0; i < 60 * k; i++) {
      let x = rng() * WORLD_W, y = rng() * WORLD_H; g.beginPath(); g.moveTo(x, y);
      for (let j = 0; j < 5; j++) { x += rng() * 50 - 25; y += rng() * 50 - 25; g.lineTo(x, y); } g.stroke();
    }
    for (let i = 0; i < 5000 * k; i++) { g.fillStyle = rng() < 0.5 ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.2)'; g.fillRect(rng() * WORLD_W, rng() * WORLD_H, 2, 2); }
  } else if (theme === 'bedroom') {
    // honey-colored floorboards
    const bh = 120;
    for (let y = 0, row = 0; y < WORLD_H; y += bh, row++) {
      let x = -((row * 731) % 1600);
      while (x < WORLD_W) {
        const len = 1100 + rng() * 900;
        g.fillStyle = `hsl(${30 + rng() * 8},${45 + rng() * 10}%,${52 + rng() * 10}%)`; g.fillRect(x, y, len, bh);
        g.strokeStyle = 'rgba(90,55,25,0.18)'; g.lineWidth = 2;
        for (let i = 0; i < 4; i++) { const gy = y + 15 + rng() * (bh - 30); g.beginPath(); g.moveTo(x, gy); g.bezierCurveTo(x + len / 3, gy + rng() * 16 - 8, x + len * 2 / 3, gy + rng() * 16 - 8, x + len, gy); g.stroke(); }
        g.fillStyle = 'rgba(60,35,15,0.45)'; g.fillRect(x, y, 3, bh);
        x += len;
      }
      g.fillStyle = 'rgba(60,35,15,0.5)'; g.fillRect(0, y, WORLD_W, 3);
    }
    // a round braided rug
    const cx = WORLD_W * 0.42, cy = WORLD_H * 0.5;
    ['#c0504d', '#f2c230', '#4a7fd6', '#6cc070', '#c0504d', '#e8e0c8', '#4a7fd6'].forEach((col, i) => {
      g.fillStyle = col; g.beginPath(); g.ellipse(cx, cy, 1100 - i * 140, 800 - i * 100, 0, 0, TAU); g.fill();
    });
  } else if (theme === 'desert') {
    g.fillStyle = '#d9954f'; g.fillRect(0, 0, WORLD_W, WORLD_H);
    for (let i = 0; i < 260 * k; i++) { // dune bands
      const x = rng() * WORLD_W, y = rng() * WORLD_H, l = 300 + rng() * 600;
      g.strokeStyle = rng() < 0.5 ? 'rgba(255,215,160,0.35)' : 'rgba(150,80,35,0.3)'; g.lineWidth = 10 + rng() * 30;
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + l / 2, y - 60 - rng() * 60, x + l, y + rng() * 40 - 20); g.stroke();
    }
    blobs(30, () => 'rgba(160,90,45,0.3)', [60, 160], [30, 70]);
    g.strokeStyle = 'rgba(120,65,30,0.35)'; g.lineWidth = 2; // cracked earth
    for (let i = 0; i < 18 * k; i++) {
      const x0 = rng() * WORLD_W, y0 = rng() * WORLD_H;
      for (let j = 0; j < 14; j++) { let x = x0 + rng() * 200 - 100, y = y0 + rng() * 200 - 100; g.beginPath(); g.moveTo(x, y); for (let q = 0; q < 3; q++) { x += rng() * 50 - 25; y += rng() * 50 - 25; g.lineTo(x, y); } g.stroke(); }
    }
    for (let i = 0; i < 5000 * k; i++) { g.fillStyle = rng() < 0.5 ? 'rgba(255,230,190,0.4)' : 'rgba(120,60,25,0.35)'; g.fillRect(rng() * WORLD_W, rng() * WORLD_H, 2, 2); }
  } else if (theme === 'mountain') {
    g.fillStyle = '#6f7a58'; g.fillRect(0, 0, WORLD_W, WORLD_H);
    blobs(220, () => rng() < 0.5 ? `rgba(${110 + rng() * 40},${115 + rng() * 30},${100 + rng() * 30},0.35)` : `rgba(${60 + rng() * 30},${85 + rng() * 30},${45 + rng() * 20},0.35)`, [60, 180], [40, 120]);
    for (let p = 0; p < 3 * k; p++) { // contour lines around hills
      const px = rng() * WORLD_W, py = rng() * WORLD_H, base = 110 + rng() * 90;
      for (let ring = 1; ring <= 4; ring++) {
        g.strokeStyle = `rgba(40,45,30,${0.2 - ring * 0.03})`; g.lineWidth = 3; g.beginPath();
        for (let a = 0; a <= TAU + 0.01; a += 0.2) { const r = base * ring * (1 + 0.18 * Math.sin(a * 3 + p)); g.lineTo(px + Math.cos(a) * r, py + Math.sin(a) * r * 0.8); }
        g.stroke();
      }
    }
    for (let i = 0; i < 4000 * k; i++) { g.fillStyle = rng() < 0.5 ? 'rgba(200,200,190,0.35)' : 'rgba(40,45,30,0.35)'; g.fillRect(rng() * WORLD_W, rng() * WORLD_H, 3, 3); } // scree
  } else if (theme === 'tundra') {
    g.fillStyle = '#8e8b66'; g.fillRect(0, 0, WORLD_W, WORLD_H);
    blobs(220, () => `rgba(${100 + rng() * 40},${95 + rng() * 35},${60 + rng() * 30},0.35)`, [60, 160], [40, 100]);
    blobs(110, () => `rgba(240,244,246,${0.55 + rng() * 0.3})`, [40, 160], [30, 90]); // snow patches
    for (let i = 0; i < 3000 * k; i++) { g.fillStyle = ['rgba(200,140,40,0.55)', 'rgba(150,170,80,0.5)', 'rgba(60,55,40,0.4)'][Math.floor(rng() * 3)]; g.fillRect(rng() * WORLD_W, rng() * WORLD_H, 3, 3); } // lichen
  } else if (theme === 'arctic') {
    g.fillStyle = '#e9f0f5'; g.fillRect(0, 0, WORLD_W, WORLD_H);
    blobs(200, () => `rgba(${170 + rng() * 40},${195 + rng() * 30},${215 + rng() * 25},0.3)`, [60, 200], [30, 90]);
    // a frozen lake with cracks
    const lx = WORLD_W * 0.55, ly = WORLD_H * 0.5;
    g.fillStyle = 'rgba(140,195,230,0.55)'; g.beginPath(); g.ellipse(lx, ly, WORLD_W * 0.16, WORLD_H * 0.2, 0.3, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 3;
    for (let i = 0; i < 40; i++) { let x = lx + (rng() - 0.5) * WORLD_W * 0.25, y = ly + (rng() - 0.5) * WORLD_H * 0.3; g.beginPath(); g.moveTo(x, y); for (let q = 0; q < 6; q++) { x += rng() * 80 - 40; y += rng() * 80 - 40; g.lineTo(x, y); } g.stroke(); }
    g.strokeStyle = 'rgba(160,185,205,0.45)'; g.lineWidth = 4; // wind-carved ridges
    for (let i = 0; i < 300 * k; i++) { const x = rng() * WORLD_W, y = rng() * WORLD_H, l = 80 + rng() * 140; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + l / 2, y - 10, x + l, y + 4); g.stroke(); }
  } else if (theme === 'carpet') {
    g.fillStyle = '#7a3a2e'; g.fillRect(0, 0, WORLD_W, WORLD_H);
    blobs(160, () => `rgba(${90 + rng() * 50},${30 + rng() * 25},${25 + rng() * 20},0.3)`, [60, 160], [40, 90]);
    // a big patterned area rug in the middle of the room
    const rx = WORLD_W * 0.2, ry = WORLD_H * 0.14, rw = WORLD_W * 0.6, rh = WORLD_H * 0.72;
    g.fillStyle = '#2f4a6b'; g.fillRect(rx, ry, rw, rh);
    g.strokeStyle = '#d9b35a'; g.lineWidth = 46; g.strokeRect(rx + 70, ry + 70, rw - 140, rh - 140);
    g.strokeStyle = '#a8452f'; g.lineWidth = 20; g.strokeRect(rx + 150, ry + 150, rw - 300, rh - 300);
    g.fillStyle = 'rgba(217,179,90,0.16)';
    for (let y = ry + 260; y < ry + rh - 260; y += 220) for (let x = rx + 260; x < rx + rw - 260; x += 220) {
      g.beginPath(); g.moveTo(x, y - 70); g.lineTo(x + 70, y); g.lineTo(x, y + 70); g.lineTo(x - 70, y); g.closePath(); g.fill();
    }
    const cx = rx + rw / 2, cy = ry + rh / 2;
    [[620, '#d9b35a'], [500, '#a8452f'], [360, '#2f4a6b'], [220, '#d9b35a']].forEach(([r, col]) => {
      g.fillStyle = col; g.beginPath(); g.moveTo(cx, cy - r); g.lineTo(cx + r * 1.3, cy); g.lineTo(cx, cy + r); g.lineTo(cx - r * 1.3, cy); g.closePath(); g.fill();
    });
    g.strokeStyle = '#e8dcc0'; g.lineWidth = 6; // fringe
    for (let y = ry; y < ry + rh; y += 18) { g.beginPath(); g.moveTo(rx, y); g.lineTo(rx - 40, y); g.moveTo(rx + rw, y); g.lineTo(rx + rw + 40, y); g.stroke(); }
    for (let i = 0; i < 6000 * k; i++) { g.fillStyle = rng() < 0.5 ? 'rgba(255,220,200,0.12)' : 'rgba(0,0,0,0.18)'; g.fillRect(rng() * WORLD_W, rng() * WORLD_H, 3, 3); }
  } else {
    g.fillStyle = '#dcc08a'; g.fillRect(0, 0, WORLD_W, WORLD_H);
    blobs(200, () => `rgba(${150 + rng() * 60},${120 + rng() * 40},${70 + rng() * 30},0.25)`, [40, 140], [20, 60]);
    g.strokeStyle = 'rgba(160,125,70,0.35)'; g.lineWidth = 3;
    for (let i = 0; i < 160 * k; i++) {
      const x = rng() * WORLD_W, y = rng() * WORLD_H, l = 60 + rng() * 120;
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + l / 2, y - 12, x + l, y); g.stroke();
    }
    for (let i = 0; i < 5000 * k; i++) { g.fillStyle = rng() < 0.5 ? 'rgba(255,240,200,0.5)' : 'rgba(120,90,50,0.4)'; g.fillRect(rng() * WORLD_W, rng() * WORLD_H, 2, 2); }
  }
  // the "edge of the battlefield"
  g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 24; g.strokeRect(0, 0, WORLD_W, WORLD_H);

}

// ---------- utility for game logic ----------
function banner(title, sub, t = 3) { G.banner = { title, sub, t, max: t }; }
function floatText(x, y, txt, col) { G.texts.push({ x, y, txt, col, t: 1.2 }); }
function squad() { return G.units.filter(u => u.team === 'g' && !u.dead && RECRUITS.includes(u.type)); }
function cmdUnits() {
  const s = squad();
  if (G.sel.size === 0) return s;
  const free = s.filter(u => !u.driver);
  const sel = free.filter(u => G.sel.has(u.id));
  return sel.length ? sel : free;
}
// closest enemy of `team` within a narrow cone around angle a (aim assist for touch & controller)
function assistAim(o, a, range, team) {
  let best = null, bs = Infinity;
  for (const u of G.units) {
    if (u.dead || u.team !== team) continue;
    const d = dist(o, u) - u.r;
    if (d > range) continue;
    const da = Math.abs(lerpAngle(a, Math.atan2(u.y - o.y, u.x - o.x), 1) - a);
    if (da < 0.4 && d + da * 300 < bs) { bs = d + da * 300; best = u; }

}
function inRect(x, y, o) { return x >= o.x && x <= o.x + o.w && y >= o.y && y <= o.y + o.h; }
function collideObs(u) {
  for (const o of G.obs) {
    const cx = clamp(u.x, o.x, o.x + o.w), cy = clamp(u.y, o.y, o.y + o.h);
    const dx = u.x - cx, dy = u.y - cy, d2 = dx * dx + dy * dy;
    if (d2 < u.r * u.r) {
      if (d2 > 1e-4) { const d = Math.sqrt(d2); u.x += dx / d * (u.r - d); u.y += dy / d * (u.r - d); }
      else {
        const l = u.x - o.x, r = o.x + o.w - u.x, t = u.y - o.y, b = o.y + o.h - u.y, m = Math.min(l, r, t, b);
        if (m === l) u.x = o.x - u.r; else if (m === r) u.x = o.x + o.w + u.r; else if (m === t) u.y = o.y - u.r; else u.y = o.y + o.h + u.r;

function steer(u, tx, ty, dt, sp) {
  const dx = tx - u.x, dy = ty - u.y, d = Math.hypot(dx, dy);
  if (d < 5) return true;
  let a = Math.atan2(dy, dx);

  const step = Math.min(d, sp * dt), ox = u.x, oy = u.y;
  u.x += Math.cos(a) * step; u.y += Math.sin(a) * step;

  const moved = Math.hypot(u.x - ox, u.y - oy);

  u.a = lerpAngle(u.a, Math.atan2(u.y - oy, u.x - ox) || u.a, Math.min(1, dt * 10));

function findTarget(u, range) {

  for (const o of G.units) {
    if (o.dead || o.team === u.team) continue;
    const d = dist(u, o) - o.r;

// ---------- combat ----------
function fire(u, wkey, tx, ty, extra) {
  const W = WEAP[wkey];
  const base = Math.atan2(ty - u.y, tx - u.x);
  let a = base + rand(-(W.spread || 0), W.spread || 0);
  const off = u.r + (u.T.kind === 'tank' ? 16 : 6);
  const mx = u.x + Math.cos(base) * off, my = u.y + Math.sin(base) * off;
  if (W.kind === 'mine') {
    G.mines.push({ x: u.x - Math.cos(u.a) * (u.r + 8), y: u.y - Math.sin(u.a) * (u.r + 8), team: u.team, arm: 1, dmg: W.dmg, splash: W.splash });
    sfx(W.snd, u.x, u.y);
    return;
  }
  if (W.kind === 'grenade') {
    const d = clamp(Math.hypot(tx - u.x, ty - u.y), W.minRange || 0, W.range);
    const ga = base + (W.arc ? rand(-0.05, 0.05) : 0);
    G.bullets.push({ kind: 'grenade', team: u.team, sx: mx, sy: my, tx: u.x + Math.cos(ga) * d, ty: u.y + Math.sin(ga) * d, t: 0,
      dur: W.arc ? 0.7 + d / 650 : 0.35 + d / 900, h: W.arc || 60, dmg: W.dmg, splash: W.splash, x: mx, y: my });
  } else {
    for (let i = 0; i < (W.pellets || 1); i++) {
      if (i) a = base + rand(-(W.spread || 0), W.spread || 0);
      const spd = W.spd * (W.pellets ? rand(0.85, 1.1) : 1);
      const b = { kind: W.kind, x: mx, y: my, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: W.life || W.range / W.spd * 1.1,
        maxLife: W.life || W.range / W.spd * 1.1, team: u.team, dmg: W.dmg, splash: W.splash || 0,
        hits: W.kind === 'flame' || W.pierce ? new Set() : null, pierce: W.pierce || 0, sniper: !!W.pierce };
      if (extra) Object.assign(b, extra);
      G.bullets.push(b);
    }
  }
  if (W.kind === 'bullet') addPart({ x: mx, y: my, vx: 0, vy: 0, life: 0.06, size: 7, col: '#ffe48a', type: 'flash' });
  if (W.kind === 'rocket' || W.kind === 'shell') for (let i = 0; i < 5; i++) addPart({ x: mx, y: my, vx: rand(-40, 40), vy: rand(-40, 40), life: 0.5, size: rand(5, 9), col: '#bbb', type: 'smoke' });
  sfx(W.snd, u.x, u.y);
}

function damage(u, amt, fromTeam) {
  if (u.dead) return;
  if (u.type === 'boss' && u.shield) {
    if (Math.random() < 0.3) { addPart({ x: u.x + rand(-30, 30), y: u.y + rand(-30, 30), vx: 0, vy: 0, life: 0.3, size: 10, col: '#7fe8ff', type: 'flash' }); sfx('shield', u.x, u.y); }
    return;
  }
  if (fromTeam === 't') amt *= DIFF().enemyDmg;
  u.hp -= amt; u.flash = 0.08; u.lastHit = G.time;
  if (u === G.sarge) { G.sarge.regenT = 4; if (amt > 5) { sfx('hurt'); rumble(0.5, 0.3, 120); } }
  if (u.driver && amt > 5) rumble(0.4, 0.4, 90);
  if (u.hp <= 0) kill(u);
}

function kill(u) {
  u.dead = true;
  if (u.team === 't') {
    G.kills++;
    const b = Math.round((u.T.bounty || 0) * DIFF().bounty);
    if (b) { G.plastic += b; floatText(u.x, u.y - 20, '+' + b, '#bff27a'); }
    const src = G.units.find(x => x.id === u.src); if (src) src.kids--;
    if (!u.T.building && u.type !== 'boss') {
      const r = Math.random();
      if (r < 0.1) G.pickups.push({ x: u.x, y: u.y, kind: 'hp', t: 25 });
      else if (r < 0.18) G.pickups.push({ x: u.x, y: u.y, kind: 'ammo', t: 25 });
    }
  } else if (RECRUITS.includes(u.type)) { G.lost++; G.sel.delete(u.id); }
  if (u.driver) {
    // vehicle destroyed under Sarge: bail out
    const s = u.driver; u.driver = null; s.driving = null;
    s.x = u.x + 20; s.y = u.y; collideObs(s); G.units.push(s);
    banner('', 'Your ' + TYPES[u.type].name + ' was destroyed!', 2);
    damage(s, 40, u.team === 'g' ? 't' : 'g');
  }

  if (u.T.building || u.type === 'boss' || u.T.vehicle) {
    const big = !u.T.vehicle;
    explodeFx(u.x, u.y, big ? 110 : 70, true);
    if (big) for (let i = 0; i < 6; i++) setTimeout(() => G && explodeFx(u.x + rand(-60, 60), u.y + rand(-60, 60), 60, false), 150 * i);
    G.decals.push({ x: u.x, y: u.y, kind: 'scorch', r: u.r * 1.8, t: 60 });
    G.decals.push({ x: u.x, y: u.y, kind: 'rubble', r: u.r, t: 60, team: u.team, type: u.type });
  } else {
    G.decals.push({ x: u.x, y: u.y, kind: 'fallen', a: rand(0, TAU), team: u.team, r: u.r, t: 18, wtype: u.T.weapon });
    for (let i = 0; i < 6; i++) addPart({ x: u.x, y: u.y, vx: rand(-90, 90), vy: rand(-90, 90), life: 0.5, size: 3, col: COL[u.team].body, type: 'debris' });
  }

  if (u.type === 'bunker') {
    G.outposts.push({ x: u.x, y: u.y });
    const left = G.bunkers.filter(b => !b.dead).length;
    if (left > 0) banner('Bunker destroyed!', left + ' remaining · outpost established for reinforcements', 2.8);
    else if (G.boss && !G.boss.dead) { G.boss.shield = false; banner('SHIELD DOWN!', 'The Tan Overlord is vulnerable. Take him out!', 3.5); sfx('alarm'); }
  }
  if (u.type === 'boss') banner('THE OVERLORD HAS FALLEN!', 'Plastic justice is served.', 4);
  if (u === G.sarge) {
    G.lives--;
    if (G.lives > 0 && !G.hq.dead) { G.respawn = 4; banner('Sarge is down!', 'Redeploying from the nearest outpost...', 3); }
    else { G.endT = 2.5; G.result = 'over'; G.reason = G.hq.dead ? 'HQ destroyed' : 'Sarge is out of lives'; }
  }
  if (u === G.hq) { G.endT = 2.5; G.result = 'over'; G.reason = 'Your HQ was destroyed'; banner('HQ DESTROYED', '', 3); }
}

function explode(x, y, R, dmg, team) {
  for (const u of G.units) {
    if (u.dead || u.team === team) continue;
    const d = Math.max(0, dist(u, { x, y }) - u.r);
    if (d < R) {
      damage(u, dmg * (1 - 0.6 * d / R), team);
      if (!u.T.building && u.type !== 'boss' && !u.dead) {
        const a = Math.atan2(u.y - y, u.x - x); u.x += Math.cos(a) * 12; u.y += Math.sin(a) * 12; collideObs(u);
      }
    }
  }
  for (const o of G.obs) {
    if (o.hp == null) continue;
    const cx = clamp(x, o.x, o.x + o.w), cy = clamp(y, o.y, o.y + o.h);
    if (Math.hypot(x - cx, y - cy) < R) damageObs(o, dmg);

}
function explodeFx(x, y, R, big) {
  const n = big ? 40 : 18;
  addPart({ x, y, vx: 0, vy: 0, life: 0.35, size: R, col: '#fff3b0', type: 'ring' });
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(40, big ? 320 : 200);
    addPart({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.25, 0.6), size: rand(6, big ? 22 : 14), col: Math.random() < 0.5 ? '#ffb430' : '#ff6a1f', type: 'fire' });
  }
  for (let i = 0; i < n / 2; i++) addPart({ x: x + rand(-R / 3, R / 3), y: y + rand(-R / 3, R / 3), vx: rand(-30, 30), vy: rand(-50, -10), life: rand(0.8, 1.6), size: rand(12, 26), col: '#555', type: 'smoke' });
  G.decals.push({ x, y, kind: 'scorch', r: R * 0.6, t: 25 });
  const cd = Math.hypot(x - G.cam.x, y - G.cam.y);
  const near = clamp(1 - cd / 900, 0, 1);
  G.shake = Math.min(22, G.shake + (big ? 16 : 7) * near);
  if (near > 0.3) rumble(big ? 0.9 : 0.5 * near, 0.4 * near, big ? 400 : 160);
  sfx(big ? 'bigboom' : 'boom', x, y);
}
function damageObs(o, dmg) {
  if (o.hp == null || o.dead) return;
  o.hp -= dmg; o.flash = 0.08;
  if (o.hp <= 0) {
    o.dead = true;
    const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
    const col = { crate: '#a8743c', ice: '#cfeaf7', cactus: '#3e7d3a', shrub: '#5d5a2e' }[o.kind] || '#9a8f62';
    for (let i = 0; i < 14; i++) addPart({ x: cx + rand(-o.w / 2, o.w / 2), y: cy + rand(-o.h / 2, o.h / 2), vx: rand(-150, 150), vy: rand(-150, 150), life: rand(0.4, 0.8), size: rand(3, 7), col, type: 'debris' });
    if (o.kind === 'crate') {
      const r = Math.random();
      G.pickups.push({ x: cx, y: cy, kind: r < 0.35 ? 'ammo' : r < 0.65 ? 'hp' : 'plastic', t: 30 });

const MAX_PARTS = 900;
function addPart(p) { if (G.parts.length < MAX_PARTS) { p.max = p.life; G.parts.push(p); } }

// ---------- player commands ----------
function recruit(type) {
  const T = TYPES[type];
  if (G.hq.dead) return;
  if (squad().length >= MAX_SQUAD) { banner('', 'Squad is at max size (' + MAX_SQUAD + ')', 1.5); sfx('deny'); return; }
  if (G.plastic < T.cost) { banner('', 'Need ' + T.cost + ' plastic for a ' + T.name, 1.5); sfx('deny'); return; }
  G.plastic -= T.cost;
  const sp = spawnPoint(G.sarge), a = rand(0, TAU), off = sp === G.hq ? 70 : 55;
  const u = spawn(type, sp.x + Math.cos(a) * off, sp.y + Math.sin(a) * off);
  if (!T.air) collideObs(u);
  u.order = { type: 'follow' };
  floatText(u.x, u.y - 24, T.name + ' ready!', '#bff27a');
  sfx('recruit');
}
// HQ or the outpost closest to `near`, where recruits arrive and Sarge redeploys
function spawnPoint(near) {
  let best = G.hq, bd = Infinity;
  for (const p of [G.hq, ...G.outposts]) { const d = dist(p, near); if (d < bd) { bd = d; best = p; } }
  return best;
}
function orderFollow() {
  for (const u of cmdUnits()) u.order = { type: 'follow' };
  if (G.sarge && !G.sarge.dead) G.pings.push({ x: G.sarge.x, y: G.sarge.y, t: 0.6, col: '#9ef06a' });
  sfx('order');
}
function orderHold() {
  for (const u of cmdUnits()) u.order = { type: 'hold', x: u.x, y: u.y };
  sfx('order');
}
function rightClick() {
  let wx = mouse.wx, wy = mouse.wy;
  const mm = minimapRect(), lx = mouse.x / HS, ly = mouse.y / HS;
  if (lx >= mm.x && lx <= mm.x + mm.w && ly >= mm.y && ly <= mm.y + mm.h) {
    wx = (lx - mm.x) / mm.w * WORLD_W; wy = (ly - mm.y) / mm.h * WORLD_H;
  }
  orderAt(wx, wy);
}
function orderAt(wx, wy) {
  const units = cmdUnits();
  if (!units.length) return;
  let tgt = null;
  for (const o of G.units) if (!o.dead && o.team === 't' && Math.hypot(o.x - wx, o.y - wy) < o.r + 12) tgt = o;
  if (tgt) {
    for (const u of units) u.order = u.type === 'medic' ? { type: 'follow' } : { type: 'attack', target: tgt };
    G.pings.push({ x: tgt.x, y: tgt.y, t: 0.6, col: '#ff5a3c' });
  } else {
    const n = units.length, cols = Math.ceil(Math.sqrt(n));
    units.forEach((u, i) => {
      const ox = (i % cols - (cols - 1) / 2) * 30, oy = (Math.floor(i / cols) - (Math.ceil(n / cols) - 1) / 2) * 30;
      u.order = { type: 'move', x: clamp(wx + ox, 20, WORLD_W - 20), y: clamp(wy + oy, 20, WORLD_H - 20) };
    });
    G.pings.push({ x: wx, y: wy, t: 0.6, col: '#9ef06a' });
  }
  sfx('order');
}
function finishDrag() {
  const d = mouse.drag;
  const x0 = Math.min(d.x, mouse.wx), x1 = Math.max(d.x, mouse.wx), y0 = Math.min(d.y, mouse.wy), y1 = Math.max(d.y, mouse.wy);
  G.sel.clear();
  if (x1 - x0 < 6 && y1 - y0 < 6) {
    // shift-click: pick single unit or clear selection
    for (const u of squad()) if (Math.hypot(u.x - d.x, u.y - d.y) < u.r + 6) G.sel.add(u.id);
  } else {
    for (const u of squad()) if (u.x >= x0 && u.x <= x1 && u.y >= y0 && u.y <= y1) G.sel.add(u.id);
  }
  if (G.sel.size) sfx('order');
}
function cycleWeapon(dir) { const s = G.sarge; const n = SARGE_SLOTS.length; s.slot = (s.slot + dir + n) % n; }

// ---------- vehicles ----------
function nearestFreeVehicle(s, maxD) {
  let best = null, bd = maxD;
  for (const u of G.units) {
    if (u.dead || u.team !== 'g' || !u.T.vehicle || u.driver) continue;
    const d = dist(u, s) - u.r;
    if (d < bd) { bd = d; best = u; }
  }
  return best;
}
function toggleVehicle() {
  const s = G.sarge;
  if (!G || s.dead) return;
  if (s.driving) {
    const v = s.driving;
    v.driver = null; v.order = { type: 'follow' }; s.driving = null;
    const a = v.a + Math.PI / 2;
    s.x = v.x + Math.cos(a) * (v.r + 16); s.y = v.y + Math.sin(a) * (v.r + 16); collideObs(s);
    G.units.push(s);
    sfx('order');
    return;
  }
  const v = nearestFreeVehicle(s, 60);
  if (!v) { floatText(s.x, s.y - 26, 'No vehicle nearby', '#ffd76a'); sfx('deny'); return; }
  v.driver = s; s.driving = v; v.target = null;
  const i = G.units.indexOf(s); if (i >= 0) G.units.splice(i, 1);
  G.sel.delete(v.id);
  floatText(v.x, v.y - 32, TYPES[v.type].name + ': you drive!', '#bff27a');
  sfx('engine');
}

// ---------- update ----------
const SARGE_SLOTS = [
  { w: 's_rifle', name: 'Rifle', ammo: Infinity, refill: 0 },
  { w: 's_mg', name: 'MG', ammo: 300, refill: 120 },
  { w: 's_shotgun', name: 'Shotgun', ammo: 40, refill: 14 },
  { w: 's_sniper', name: 'Sniper', ammo: 20, refill: 6 },
  { w: 's_bazooka', name: 'Bazooka', ammo: 8, refill: 4 },
  { w: 's_flamer', name: 'Flamer', ammo: 160, refill: 80 },
  { w: 's_grenade', name: 'Grenade', ammo: 4, refill: 2 },
  { w: 's_mine', name: 'Mine', ammo: 4, refill: 2 },
];

// Gathers move + aim + fire intent from whichever input is active (keyboard/mouse, touch, controller).
function readInput(o, W, distAim) {
  let mx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  let my = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  let mag = 1;
  const mv = stickVec(moveStick);
  if (mv && mv.mag > 0.15) { mx = mv.dx; my = mv.dy; mag = Math.min(1, mv.mag * 1.25); }
  if (padMode && pad && (pad.lx || pad.ly)) { mx = pad.lx; my = pad.ly; mag = Math.min(1, Math.hypot(mx, my) * 1.15); }
  const l = Math.hypot(mx, my);
  let aimX = mouse.wx, aimY = mouse.wy, fire = mouse.left;
  const range = W.range || 200;
  const aimFrom = (a, strength) => {
    const reach = distAim ? range * clamp(strength, 0.3, 1) : range * 0.9;
    aimX = o.x + Math.cos(a) * reach; aimY = o.y + Math.sin(a) * reach;
    const t = range > 0 ? assistAim(o, a, range, 't') : null;
    if (t && !distAim) { aimX = t.x; aimY = t.y; }
  };
  if (touchMode) {
    const av = stickVec(aimStick);
    fire = false;
    if (av && av.mag > 0.2) { aimFrom(Math.atan2(av.dy, av.dx), av.mag); fire = true; }
    else if (l) { aimX = o.x + mx / l * 100; aimY = o.y + my / l * 100; }
    else { aimX = o.x + Math.cos(o.aimA ?? o.a) * 100; aimY = o.y + Math.sin(o.aimA ?? o.a) * 100; }
  } else if (padMode && pad) {
    const rl = Math.hypot(pad.rx, pad.ry);
    if (rl > 0.3) padAimA = Math.atan2(pad.ry, pad.rx);
    else if (l) padAimA = lerpAngle(padAimA, Math.atan2(my, mx), 0.15);
    aimFrom(padAimA, rl > 0.3 ? rl : 1);
    fire = pad.rt;
  }
  return { mx, my, l, mag, aimX, aimY, fire };
}

function controlVehicle(v, dt) {
  v.cd -= dt; v.flash -= dt; v.anim += dt; v.moving = false;
  const W = WEAP[v.T.weapon];
  const inp = readInput(v, W, false);
  if (inp.l) {
    const want = Math.atan2(inp.my, inp.mx);
    if (v.T.air) {
      v.x += inp.mx / inp.l * v.T.speed * inp.mag * dt; v.y += inp.my / inp.l * v.T.speed * inp.mag * dt;
      v.x = clamp(v.x, v.r, WORLD_W - v.r); v.y = clamp(v.y, v.r, WORLD_H - v.r);
      v.a = lerpAngle(v.a, want, Math.min(1, dt * 5));
    } else {
      v.a = lerpAngle(v.a, want, Math.min(1, dt * (v.T.kind === 'jeep' ? 6 : 3)));
      const align = Math.max(0, Math.cos(want - v.a));
      const sp = v.T.speed * inp.mag * (0.25 + 0.75 * align);
      v.x += Math.cos(v.a) * sp * dt; v.y += Math.sin(v.a) * sp * dt;
      collideObs(v);
      // run over tan infantry
      for (const o of G.units) {
        if (o.dead || o.team !== 't' || o.T.building || o.T.vehicle || o.type === 'boss') continue;
        if (dist(v, o) < v.r + o.r + 2) damage(o, (v.T.kind === 'tank' ? 140 : 90) * dt, 'g');
      }
    }
    v.moving = true;
  }
  v.ta = Math.atan2(inp.aimY - v.y, inp.aimX - v.x);
  v.aimA = v.ta;
  if (inp.fire && v.cd <= 0) { fire(v, v.T.weapon, inp.aimX, inp.aimY); v.cd = W.cd; }
}

function update(dt) {
  G.time += dt;
  // camera
  const s = G.sarge;
  const me = s.driving || s;
  const focus = !s.dead ? me : G.hq;
  let leadX = 0, leadY = 0;
  if (!s.dead && !touchMode && !padMode) { leadX = (mouse.x - VW / 2) / Z * 0.22; leadY = (mouse.y - VH / 2) / Z * 0.22; }
  else if (!s.dead) { const la = me.aimA ?? me.a; leadX = Math.cos(la) * 110; leadY = Math.sin(la) * 110; }
  G.cam.x += (focus.x + leadX - G.cam.x) * Math.min(1, dt * 6);
  G.cam.y += (focus.y + leadY - G.cam.y) * Math.min(1, dt * 6);
  const hw = VW / 2 / Z, hh = VH / 2 / Z;
  G.cam.x = WORLD_W < hw * 2 ? WORLD_W / 2 : clamp(G.cam.x, hw, WORLD_W - hw);
  G.cam.y = WORLD_H < hh * 2 ? WORLD_H / 2 : clamp(G.cam.y, hh, WORLD_H - hh);
  mouse.wx = (mouse.x - VW / 2) / Z + G.cam.x;
  mouse.wy = (mouse.y - VH / 2) / Z + G.cam.y;
  G.shake = Math.max(0, G.shake - dt * 40);

  updateSarge(dt);

  // respawn
  if (s.dead && G.respawn > 0) {
    G.respawn -= dt;
    if (G.respawn <= 0 && !G.hq.dead) {
      const sp = spawnPoint(s);
      s.dead = false; s.hp = s.maxHp; s.x = sp.x + 80; s.y = sp.y; s.driving = null; collideObs(s);
      SARGE_SLOTS.forEach((sl, i) => { if (sl.refill) s.ammo[i] = Math.max(s.ammo[i], Math.ceil(sl.ammo / 2)); });
      G.units.push(s); G.pings.push({ x: s.x, y: s.y, t: 0.8, col: '#9ef06a' });
    }
  }

  // tan attack waves (from up to three bunkers)
  G.waveT -= dt;
  if (G.waveT <= 0) {
    G.waveT = G.L.waveT * DIFF().wave;
    const live = G.bunkers.filter(b => !b.dead).sort(() => Math.random() - 0.5).slice(0, 3);
    if (live.length) {
      banner('', '⚠ Tan attack wave incoming!', 2.5); sfx('alarm');
      for (const b of live) for (let i = 0; i < 2 + Math.min(3, Math.floor(G.idx / 3)); i++) {
        const a = rand(0, TAU); spawnTan(b, pickMix(G.L.mix, Math.random), b.x + Math.cos(a) * 60, b.y + Math.sin(a) * 60, true);
      }
    }
  }

  // follower slot assignment
  const followers = G.units.filter(u => u.team === 'g' && !u.dead && !u.driver && u.order.type === 'follow' && RECRUITS.includes(u.type));
  followers.forEach((u, i) => { u.slotIdx = i; u.slotN = followers.length; });

  for (const u of G.units) {
    if (u.dead || u === G.sarge || u.driver) continue;
    u.cd -= dt; u.flash -= dt; u.moving = false; u.anim += dt;
    if (u.type === 'hq') buildingAI(u, dt);
    else if (u.type === 'bunker') { buildingAI(u, dt); bunkerSpawn(u, dt); }
    else if (u.type === 'boss') bossAI(u, dt);
    else if (u.team === 'g') squadAI(u, dt);
    else tanAI(u, dt);
  }
  separate();

  updateBullets(dt);

  // mines
  for (const m of G.mines) {
    m.arm -= dt;
    if (m.arm > 0) continue;
    for (const u of G.units) {
      if (u.dead || u.team === m.team || u.T.air || u.T.building) continue;
      if (dist(u, m) < u.r + 22) { m.dead = true; explode(m.x, m.y, m.splash, m.dmg, m.team); break; }
    }
  }
  G.mines = G.mines.filter(m => !m.dead);

  // particles
  for (const p of G.parts) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === 'debris' || p.type === 'fire') { p.vx *= 0.92; p.vy *= 0.92; }
    if (p.type === 'smoke') { p.vx *= 0.97; p.vy *= 0.97; }
  }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const d of G.decals) d.t -= dt;
  G.decals = G.decals.filter(d => d.t > 0);
  if (G.decals.length > 260) G.decals.splice(0, G.decals.length - 260);
  for (const t of G.texts) { t.t -= dt; t.y -= 30 * dt; }
  G.texts = G.texts.filter(t => t.t > 0);
  for (const p of G.pings) p.t -= dt;
  G.pings = G.pings.filter(p => p.t > 0);
  for (const o of G.obs) if (o.flash > 0) o.flash -= dt;
  G.obs = G.obs.filter(o => !o.dead);

  // pickups (Sarge collects them on foot or by vehicle)
  for (const p of G.pickups) {
    p.t -= dt;
    const pr = s.driving ? s.driving.r + 16 : 28;
    if (!s.dead && Math.hypot(p.x - s.x, p.y - s.y) < pr) {
      p.t = 0; sfx('pickup');
      if (p.kind === 'hp') {
        if (s.driving) { const v = s.driving; v.hp = Math.min(v.maxHp, v.hp + 120); floatText(p.x, p.y, 'Repaired!', '#ff8a8a'); }
        else { s.hp = Math.min(s.maxHp, s.hp + 70); floatText(p.x, p.y, '+70 HP', '#ff8a8a'); }
      }
      else if (p.kind === 'ammo') { SARGE_SLOTS.forEach((sl, i) => { s.ammo[i] += sl.refill; }); floatText(p.x, p.y, 'AMMO!', '#ffd76a'); }
      else { G.plastic += 35; floatText(p.x, p.y, '+35 plastic', '#bff27a'); }
    }
  }
  G.pickups = G.pickups.filter(p => p.t > 0);

  G.units = G.units.filter(u => !u.dead);

  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }

  // win / lose
  if (!G.result && G.bunkers.every(b => b.dead) && (!G.boss || G.boss.dead)) { G.result = 'win'; G.endT = 2.5; }
  if (G.result) {
    G.endT -= dt;
    if (G.endT <= 0) {
      if (G.result === 'win') {
        carry = { plastic: G.plastic + 100, squad: squad().map(u => u.type) };
        state = G.idx === LEVELS.length - 1 ? 'victory' : 'levelwin';
        sfx('win');
      } else { state = 'over'; sfx('lose'); }
    }
  }
}

function updateSarge(dt) {
  const s = G.sarge;
  if (s.dead) return;
  if (s.driving) {
    const v = s.driving;
    controlVehicle(v, dt);
    s.x = v.x; s.y = v.y; s.a = v.a; s.aimA = v.ta;
    return;
  }
  s.cd -= dt; s.flash -= dt; s.anim += dt;
  const slot = SARGE_SLOTS[s.slot], W = WEAP[slot.w];
  const inp = readInput(s, W, slot.w === 's_grenade');
  s.moving = inp.l > 0;
  if (inp.l) {
    const sp = TYPES.sarge.speed * (slot.w === 's_bazooka' ? 0.85 : 1) * inp.mag;
    s.x += inp.mx / inp.l * sp * dt; s.y += inp.my / inp.l * sp * dt; collideObs(s);
  }
  s.a = Math.atan2(inp.aimY - s.y, inp.aimX - s.x);
  s.aimA = s.a;
  if (inp.fire && s.cd <= 0) {
    if (s.ammo[s.slot] > 0) {
      fire(s, slot.w, inp.aimX, inp.aimY);
      s.cd = W.cd; s.ammo[s.slot]--;
    } else { s.cd = 0.4; sfx('deny'); floatText(s.x, s.y - 24, 'Out of ' + slot.name + ' ammo!', '#ffd76a'); }
  }
  s.regenT -= dt;
  if (s.regenT <= 0 && s.hp < s.maxHp) s.hp = Math.min(s.maxHp, s.hp + 6 * dt);
}

function shootAt(u, t, wkey) {
  const W = WEAP[wkey];
  const d = dist(u, t);
  u.ta = Math.atan2(t.y - u.y, t.x - u.x);
  if (!u.T.vehicle) u.a = lerpAngle(u.a, u.ta, 0.5);
  if (W.minRange && d < W.minRange) return;
  if (u.cd <= 0) { fire(u, wkey, t.x + rand(-4, 4), t.y + rand(-4, 4)); u.cd = W.cd * rand(0.85, 1.15); }
}

function squadAI(u, dt) {
  const W = WEAP[u.T.weapon];
  const s = G.sarge;
  if (u.type === 'medic') return medicAI(u, dt);
  u.retarget -= dt;
  if (u.retarget <= 0) {
    u.retarget = 0.25 + Math.random() * 0.15;
    if (u.order.type === 'attack') {
      if (!u.order.target || u.order.target.dead) u.order = { type: 'hold', x: u.x, y: u.y };
      else u.target = u.order.target;
    }
    if (u.order.type !== 'attack') u.target = findTarget(u, u.T.sight);
  }
  if (u.target && u.target.dead) u.target = null;
  let anchor, leash;
  if (u.order.type === 'follow') {
    const lead = !s.dead ? s : G.hq;
    const i = u.slotIdx || 0, n = u.slotN || 1;
    const ring = Math.floor(i / 7), idx = i % 7, cnt = Math.min(7, n - ring * 7);
    const fa = (!s.dead ? s.a : 0) + Math.PI + (idx - (cnt - 1) / 2) * 0.5;
    const rr = 62 + ring * 36;
    anchor = { x: lead.x + Math.cos(fa) * rr, y: lead.y + Math.sin(fa) * rr };
    leash = 240;
  } else if (u.order.type === 'move' || u.order.type === 'hold') { anchor = { x: u.order.x, y: u.order.y }; leash = 160; }
  else { anchor = u.target || u; leash = 1e9; }

  const t = u.target;
  let dest = anchor, inRange = false;
  if (t) {
    const d = dist(u, t) - t.r;
    inRange = d <= W.range * 0.92;
    if (d <= W.range) shootAt(u, t, u.T.weapon);
    if (u.order.type !== 'move') {
      if (inRange) dest = null;
      else if (dist(t, anchor) < leash + W.range) dest = t;
    }
  }
  if (dest) {
    const dd = Math.hypot(dest.x - u.x, dest.y - u.y);
    const close = dest === t ? 0 : (u.order.type === 'follow' ? 18 : 6);
    if (dd > close) steer(u, dest.x, dest.y, dt, u.T.speed * (u.order.type === 'follow' && dd > 160 ? 1.3 : 1));
  }
  if (u.order.type === 'move' && Math.hypot(u.order.x - u.x, u.order.y - u.y) < 12) u.order = { type: 'hold', x: u.order.x, y: u.order.y };
}

function medicAI(u, dt) {
  const s = G.sarge;
  u.retarget -= dt;
  if (u.retarget <= 0) {
    u.retarget = 0.3;
    let best = null, bv = 0.98;
    for (const o of G.units) {
      if (o.dead || o.team !== 'g' || o === u || o.T.building) continue;
      const f = o.hp / o.maxHp;
      if (f < bv && dist(u, o) < u.T.sight) { bv = f; best = o; }
    }
    u.target = best;
  }
  const t = u.target;
  if (t && !t.dead && t.hp < t.maxHp) {
    if (dist(u, t) > WEAP.heal.range - 10) steer(u, t.x, t.y, dt, u.T.speed);
    else {
      u.a = lerpAngle(u.a, Math.atan2(t.y - u.y, t.x - u.x), 0.3);
      if (u.cd <= 0) {
        u.cd = WEAP.heal.cd; t.hp = Math.min(t.maxHp, t.hp + WEAP.heal.heal);
        for (let i = 0; i < 4; i++) addPart({ x: t.x + rand(-8, 8), y: t.y + rand(-8, 8), vx: 0, vy: -40, life: 0.6, size: 4, col: '#7dff8a', type: 'plus' });
        sfx('heal', u.x, u.y);
      }
    }
    return;
  }
  let anchor;
  if (u.order.type === 'follow') { const lead = !s.dead ? s : G.hq; anchor = { x: lead.x - Math.cos(s.a || 0) * 40, y: lead.y - Math.sin(s.a || 0) * 40 }; }
  else anchor = { x: u.order.x, y: u.order.y };
  if (anchor.x !== undefined && Math.hypot(anchor.x - u.x, anchor.y - u.y) > 30) steer(u, anchor.x, anchor.y, dt, u.T.speed);
  if (u.order.type === 'move' && Math.hypot(u.order.x - u.x, u.order.y - u.y) < 12) u.order = { type: 'hold', x: u.order.x, y: u.order.y };
}

function tanAI(u, dt) {
  const W = WEAP[u.T.weapon];
  if (!u.home) { u.home = { x: u.x, y: u.y }; u.wanderT = 0; }
  u.retarget -= dt;
  if (u.retarget <= 0) { u.retarget = 0.3 + Math.random() * 0.2; u.target = findTarget(u, u.T.sight); }
  if (u.target && u.target.dead) u.target = null;
  const t = u.target;
  const leash = u.raider ? 1e9 : 380;
  if (t) {
    const d = dist(u, t) - t.r;
    if (d <= W.range) shootAt(u, t, u.T.weapon);
    if (d > W.range * 0.85 && (u.raider || dist(t, u.home) < leash + W.range)) steer(u, t.x, t.y, dt, u.T.speed);
    else if (!u.raider && dist(u, u.home) > leash) steer(u, u.home.x, u.home.y, dt, u.T.speed);
  } else if (u.raider) {
    const goal = !G.hq.dead ? G.hq : G.sarge;
    steer(u, goal.x, goal.y, dt, u.T.speed);
  } else {
    u.wanderT -= dt;
    if (u.wanderT <= 0) { u.wanderT = rand(2, 5); const a = rand(0, TAU), r = rand(60, 220); u.wx = u.home.x + Math.cos(a) * r; u.wy = u.home.y + Math.sin(a) * r; }
    if (Math.hypot(u.wx - u.x, u.wy - u.y) > 10) steer(u, u.wx, u.wy, dt, u.T.speed * 0.5);
  }
  if (u.T.vehicle && !t) u.ta = lerpAngle(u.ta, u.a, dt * 3);
}

function buildingAI(u, dt) {
  u.retarget -= dt;
  if (u.retarget <= 0) { u.retarget = 0.4; u.target = findTarget(u, u.T.sight); }
  if (u.target && !u.target.dead) shootAt(u, u.target, u.T.weapon);
}
function bunkerSpawn(b, dt) {
  b.spawnT -= dt;
  if (b.spawnT <= 0) {
    b.spawnT = G.L.spawnRate * DIFF().spawn * rand(0.8, 1.2);
    if (b.kids < G.L.cap + DIFF().cap) {
      const a = Math.PI + rand(-1.2, 1.2);
      spawnTan(b, pickMix(G.L.mix, Math.random), b.x + Math.cos(a) * 60, b.y + Math.sin(a) * 60, Math.random() < G.L.raid);
    }
  }
}

function bossAI(u, dt) {
  const s = G.sarge;
  const enraged = u.hp < u.maxHp * 0.4;
  u.retarget -= dt;
  if (u.retarget <= 0) { u.retarget = 0.4; u.target = findTarget(u, u.T.sight); }
  if (u.target && u.target.dead) u.target = null;
  const t = u.target;

  if (u.charge > 0) {
    u.charge -= dt;
    u.x += u.cvx * dt; u.y += u.cvy * dt; collideObs(u); u.moving = true;
    if (Math.random() < 0.6) addPart({ x: u.x + rand(-20, 20), y: u.y + rand(-20, 20), vx: 0, vy: 0, life: 0.6, size: 14, col: '#c9a873', type: 'smoke' });
    for (const o of G.units) {
      if (o.dead || o.team !== 'g' || o.T.building || u.chargeHit.has(o.id)) continue;
      if (dist(u, o) < u.r + o.r + 4) {
        u.chargeHit.add(o.id); damage(o, 45, 't');
        const a = Math.atan2(o.y - u.y, o.x - u.x); o.x += Math.cos(a) * 50; o.y += Math.sin(a) * 50; if (!o.dead) collideObs(o);
      }
    }
    return;
  }
  // movement
  const leash = u.shield ? 220 : 1e9;
  if (t) {
    u.a = lerpAngle(u.a, Math.atan2(t.y - u.y, t.x - u.x), 0.15);
    if (dist(u, t) > 200 && dist(t, u.home) < leash + 300) steer(u, t.x, t.y, dt, u.T.speed * (enraged ? 1.3 : 1));
    if (dist(u, t) < 330) shootAt(u, t, 't_mg');
  } else if (dist(u, u.home) > 30) steer(u, u.home.x, u.home.y, dt, u.T.speed);

  // special attacks
  u.phaseT -= dt * (enraged ? 1.6 : 1);
  if (u.attack) {
    u.atkT -= dt;
    if (u.attack === 'ring' && u.atkT <= 0) {
      u.atkT = 0.35; u.burst--;
      const off = rand(0, TAU);
      for (let i = 0; i < 18; i++) {
        const a = off + i / 18 * TAU;
        G.bullets.push({ kind: 'orb', x: u.x + Math.cos(a) * 36, y: u.y + Math.sin(a) * 36, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, life: 2.4, maxLife: 2.4, team: 't', dmg: 10, splash: 0 });
      }
      sfx('tshot', u.x, u.y);
      if (u.burst <= 0) u.attack = null;
    } else if (u.attack === 'rockets' && u.atkT <= 0) {
      u.atkT = 0.22; u.burst--;
      const tg = G.units.filter(o => !o.dead && o.team === 'g' && dist(o, u) < 750);
      const pick = tg.length ? tg[Math.floor(Math.random() * tg.length)] : null;
      if (pick) fire(u, 'b_rocket', pick.x, pick.y, { homing: pick, turn: 2.2 });
      if (u.burst <= 0) u.attack = null;
    }
    return;
  }
  if (u.phaseT <= 0 && t) {
    u.phaseT = rand(3.2, 4.5);
    const opts = ['ring', 'rockets', 'summon'];
    if (!u.shield) opts.push('charge', 'charge');
    const pick = opts[Math.floor(Math.random() * opts.length)];
    if (pick === 'ring') { u.attack = 'ring'; u.burst = enraged ? 4 : 3; u.atkT = 0.3; floatText(u.x, u.y - 50, 'BOW BEFORE ME!', '#ffd76a'); }
    else if (pick === 'rockets') { u.attack = 'rockets'; u.burst = enraged ? 7 : 5; u.atkT = 0.2; floatText(u.x, u.y - 50, 'ROCKET BARRAGE!', '#ffd76a'); }
    else if (pick === 'summon') {
      floatText(u.x, u.y - 50, 'MINIONS, ATTACK!', '#ffd76a'); sfx('alarm', u.x, u.y);
      for (let i = 0; i < (enraged ? 4 : 3); i++) {
        const a = rand(0, TAU);
        spawn(Math.random() < 0.3 ? 't_bazooka' : 't_rifle', u.x + Math.cos(a) * 70, u.y + Math.sin(a) * 70, { home: { x: u.x, y: u.y }, raider: true, wanderT: 0 });
      }
    } else if (pick === 'charge') {
      const tg = !s.dead ? s : t;
      const a = Math.atan2(tg.y - u.y, tg.x - u.x);
      u.charge = 0.9; u.cvx = Math.cos(a) * 420; u.cvy = Math.sin(a) * 420; u.chargeHit = new Set(); u.a = a;
      floatText(u.x, u.y - 50, 'CHARGE!', '#ffd76a');
    }
  }
}

function separate() {
  const us = G.units;
  for (let i = 0; i < us.length; i++) {
    const a = us[i]; if (a.dead || a.T.air) continue;
    for (let j = i + 1; j < us.length; j++) {
      const b = us[j]; if (b.dead || b.T.air) continue;
      const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
      if (Math.abs(dx) > rr || Math.abs(dy) > rr) continue;
      const d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr || d2 < 1e-6) continue;
      const d = Math.sqrt(d2), push = (rr - d), nx = dx / d, ny = dy / d;
      const aFix = a.T.building, bFix = b.T.building;
      if (aFix && bFix) continue;
      if (aFix) { b.x += nx * push; b.y += ny * push; }
      else if (bFix) { a.x -= nx * push; a.y -= ny * push; }
      else {
        const heavy = u => u.type === 'boss' || u.T.kind === 'tank' || !!u.driver;
        const wa = heavy(a) && !heavy(b) ? 0.1 : heavy(b) && !heavy(a) ? 0.9 : 0.5, wb = 1 - wa;
        a.x -= nx * push * (b.type === 'boss' ? 0.9 : wa); a.y -= ny * push * (b.type === 'boss' ? 0.9 : wa);
        b.x += nx * push * (b.type === 'boss' ? 0.1 : wb); b.y += ny * push * (b.type === 'boss' ? 0.1 : wb);
      }
    }
  }
}

function updateBullets(dt) {
  for (const b of G.bullets) {
    if (b.kind === 'grenade') {
      b.t += dt;
      const k = Math.min(1, b.t / b.dur);
      b.x = b.sx + (b.tx - b.sx) * k; b.y = b.sy + (b.ty - b.sy) * k; b.z = Math.sin(k * Math.PI) * (b.h || 60);
      if (b.t >= b.dur) { b.dead = true; explode(b.tx, b.ty, b.splash, b.dmg, b.team); }
      continue;
    }
    if (b.homing && !b.homing.dead) {
      const cur = Math.atan2(b.vy, b.vx), want = Math.atan2(b.homing.y - b.y, b.homing.x - b.x);
      const na = lerpAngle(cur, want, Math.min(1, b.turn * dt)), sp = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
    }
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.kind === 'rocket' || b.kind === 'shell') addPart({ x: b.x, y: b.y, vx: rand(-15, 15), vy: rand(-15, 15), life: 0.5, size: rand(4, 7), col: '#cfcfcf', type: 'smoke' });
    if (b.kind === 'flame') { b.vx *= 0.97; b.vy *= 0.97; }
    // obstacles
    for (const o of G.obs) {
      if (!inRect(b.x, b.y, o)) continue;
      if (b.kind === 'rocket' || b.kind === 'shell') explode(b.x, b.y, b.splash, b.dmg, b.team);
      else if (b.kind === 'flame') damageObs(o, b.dmg * 0.4);
      else { damageObs(o, b.dmg); for (let i = 0; i < 3; i++) addPart({ x: b.x, y: b.y, vx: rand(-80, 80), vy: rand(-80, 80), life: 0.2, size: 2, col: '#ffe9a0', type: 'spark' }); }
      b.dead = true; break;
    }
    if (b.dead) continue;
    // units
    for (const u of G.units) {
      if (u.dead || u.team === b.team) continue;
      const rr = u.r + (b.kind === 'flame' ? 8 : 3);
      if (dist2(u, b) > rr * rr) continue;
      if (b.kind === 'flame') {
        if (b.hits.has(u.id)) continue;
        b.hits.add(u.id); damage(u, b.dmg * (u.T.vehicle ? 0.6 : 1), b.team);
        if (Math.random() < 0.3) addPart({ x: u.x + rand(-6, 6), y: u.y + rand(-6, 6), vx: 0, vy: -30, life: 0.4, size: 6, col: '#ff8a2a', type: 'fire' });
        continue;
      }
      if (b.kind === 'rocket' || b.kind === 'shell') explode(b.x, b.y, b.splash, b.dmg, b.team);
      else if (b.hits) { // piercing sniper round
        if (b.hits.has(u.id)) continue;
        b.hits.add(u.id); damage(u, b.dmg, b.team);
        for (let i = 0; i < 4; i++) addPart({ x: b.x, y: b.y, vx: rand(-70, 70), vy: rand(-70, 70), life: 0.25, size: 2.5, col: COL[u.team].light, type: 'spark' });
        if (b.pierce-- > 0) continue;
      } else {
        damage(u, b.dmg, b.team);
        for (let i = 0; i < 3; i++) addPart({ x: b.x, y: b.y, vx: rand(-60, 60), vy: rand(-60, 60), life: 0.25, size: 2.5, col: COL[u.team].light, type: 'spark' });
      }
      b.dead = true; break;
    }
    if (!b.dead && b.life <= 0) {
      b.dead = true;
      if (b.kind === 'rocket' || b.kind === 'shell') explode(b.x, b.y, b.splash, b.dmg, b.team);
    }
  }
  G.bullets = G.bullets.filter(b => !b.dead);
}

  if (wtype === 'heal') { ctx.fillStyle = '#fff'; ctx.fillRect(-1.5 + r * 0.05, -r * 0.3, 3, r * 0.6); ctx.fillRect(r * 0.05 - r * 0.3, -1.5, r * 0.6, 3); ctx.fillStyle = '#d33'; ctx.fillRect(-1 + r * 0.05, -r * 0.22, 2, r * 0.44); ctx.fillRect(r * 0.05 - r * 0.22, -1, r * 0.44, 2); }

function star(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}

      ctx.globalCompositeOperation = 'source-over';
    } else if (b.kind === 'orb') {
      ctx.fillStyle = '#ffcf33'; circle(b.x, b.y, 6);
      ctx.fillStyle = '#fff6c0'; circle(b.x, b.y, 3);
    } else if (b.kind === 'grenade') {
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ellipse(b.x, b.y, 5, 3);
      ctx.fillStyle = b.h > 60 ? '#333' : '#3c5a26'; circle(b.x, b.y - b.z, b.h > 60 ? 6 : 5);
      ctx.fillStyle = '#888'; ctx.fillRect(b.x - 1, b.y - b.z - 8, 2, 4);
    }
  }

  // particles
  for (const p of G.parts) {
    if (!vis(p.x, p.y)) continue;
    const k = p.life / p.max;
    if (p.type === 'smoke') { ctx.fillStyle = p.col; ctx.globalAlpha = k * 0.45; circle(p.x, p.y, p.size * (1.6 - k * 0.6)); }
    else if (p.type === 'fire' || p.type === 'flash' || p.type === 'spark') {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = k; ctx.fillStyle = p.col;
      circle(p.x, p.y, p.size * (p.type === 'fire' ? 0.5 + k * 0.5 : 1));
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.type === 'ring') {
      ctx.strokeStyle = p.col; ctx.globalAlpha = k; ctx.lineWidth = 4 * k + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.1 - k * 0.8), 0, TAU); ctx.stroke();
    } else if (p.type === 'debris') { ctx.globalAlpha = Math.min(1, k * 2); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    else if (p.type === 'plus') { ctx.globalAlpha = k; ctx.fillStyle = p.col; ctx.fillRect(p.x - 1, p.y - 4, 2, 8); ctx.fillRect(p.x - 4, p.y - 1, 8, 2); }
  }
  ctx.globalAlpha = 1;

  // floating text
  ctx.textAlign = 'center'; ctx.font = 'bold 14px "Trebuchet MS",sans-serif';
  for (const t of G.texts) {
    ctx.globalAlpha = Math.min(1, t.t * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(t.txt, t.x + 1, t.y + 1);
    ctx.fillStyle = t.col; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;

  // drag box
  if (mouse.drag) {
    ctx.strokeStyle = '#b8ff7a'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
    ctx.strokeRect(mouse.drag.x, mouse.drag.y, mouse.wx - mouse.drag.x, mouse.wy - mouse.drag.y);
    ctx.setLineDash([]);
  }
}

// ---------- weather ----------
function drawWeather() {
  const w = G.L.weather;
  if (!w) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const t = G.time, n = w === 'blizzard' ? 260 : w === 'snow' ? 120 : 90;
  if (w === 'dust') {
    ctx.fillStyle = 'rgba(220,160,90,0.08)'; ctx.fillRect(0, 0, VW, VH);
    ctx.strokeStyle = 'rgba(240,200,140,0.35)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < n; i++) {
      const sp = 180 + (i % 7) * 40;
      const x = ((i * 271.3 + t * sp) % (VW + 200)) - 100, y = (i * 97.7 + Math.sin(t + i) * 20) % VH;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 30 - (i % 5) * 8, y + 2); ctx.stroke();
    }
    return;
  }
  if (w === 'blizzard') { ctx.fillStyle = 'rgba(235,242,250,0.12)'; ctx.fillRect(0, 0, VW, VH); }
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  for (let i = 0; i < n; i++) {
    const fall = 40 + (i % 6) * 18, drift = (w === 'blizzard' ? 120 : 25) + (i % 4) * 10;
    const x = ((i * 137.5 + t * drift + Math.sin(t * 1.3 + i) * 12) % (VW + 40)) - 20;
    const y = ((i * 91.3 + t * fall) % (VH + 20)) - 10;
    circle(x, y, 1 + (i % 3) * 0.8);
  }
}

// ---------- HUD ----------
function hudScale() { return touchMode ? clamp(Math.min(VW / 1000, VH / 560), 0.5, 1) : clamp(Math.min(VW / 1300, VH / 760), 0.7, 1); }
// all HUD layout happens in "logical" pixels (screen px / HS)
function minimapRect() {
  const LW = VW / HS, LH = VH / HS;
  if (touchMode) { const w = 170, h = w * WORLD_H / WORLD_W; return { x: LW - w - 14, y: 86, w, h }; }
  const w = Math.min(220, LW * 0.22), h = w * WORLD_H / WORLD_W; return { x: LW - w - 14, y: LH - h - 14, w, h };
}
function panel(x, y, w, h) { ctx.fillStyle = 'rgba(16,22,12,0.78)'; rrect(x, y, w, h, 8); ctx.fill(); ctx.strokeStyle = 'rgba(160,200,110,0.35)'; ctx.lineWidth = 1.5; ctx.stroke(); }
function txt(s, x, y, size, col, align = 'left', bold = true) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px "Trebuchet MS",sans-serif`; ctx.textAlign = align;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillText(s, x + 1, y + 1.5); ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function roundBtn(x, y, r, label, on, fn) {
  ctx.fillStyle = on ? 'rgba(120,180,70,0.85)' : 'rgba(16,22,12,0.72)';

  ctx.strokeStyle = on ? '#d6ffb0' : 'rgba(160,200,110,0.55)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  txt(label, x, y + 4, label.length > 2 ? 10 : 15, '#e7f5c9', 'center');
  hudButtons.push({ x: x - r, y: y - r, w: r * 2, h: r * 2, fn });
}

  // minimap

    const bw = Math.max(tw, sw) + 48, top = LH * 0.28 - (b.title ? 44 : 24), bh = (b.title ? 44 : 0) + (b.sub ? 34 : 0) + 6;
    ctx.fillStyle = 'rgba(16,22,12,0.62)'; rrect(LW / 2 - bw / 2, top, bw, bh, 12); ctx.fill();

    }
  }
}
function hpBarHUD(x, y, w, h, f) {
  ctx.fillStyle = '#2a1a14'; rrect(x, y, w, h, 4); ctx.fill();
  ctx.fillStyle = f > 0.5 ? '#6fd13a' : f > 0.25 ? '#e8c23a' : '#e04a3a'; rrect(x, y, Math.max(0, w * f), h, 4); ctx.fill();
}
function hudClick(sx, sy) {
  const x = sx / HS, y = sy / HS;
  for (const b of hudButtons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return true; }
  if (!G || state !== 'play') return false;
  const mm = minimapRect();
  if (x >= mm.x && x <= mm.x + mm.w && y >= mm.y && y <= mm.y + mm.h) {
    if (touchMode) { orderAt((x - mm.x) / mm.w * WORLD_W, (y - mm.y) / mm.h * WORLD_H); commandMode = false; }
    return true;
  }
  return false;
}

    for (let i = 0; i < 10; i++) titleArmy.push({ x: rand(0, VW + 200), y: VH * 0.2 + rand(-30, 40), r: 12, a: Math.PI, moving: true, anim: rand(0, 6), team: 't', w: i % 3 ? 't_rifle' : 't_bazooka', sp: -rand(30, 45) });
  }
  for (const s of titleArmy) {
    s.x += s.sp * dt; s.anim += dt;
    if (s.sp > 0 && s.x > VW + 40) s.x = -40; if (s.sp < 0 && s.x < -40) s.x = VW + 40;
    drawSoldier(s, s.team, s.w, false);
  }
  // menu is laid out in logical pixels and scaled to fit short phone screens
  HS = Math.min(1, VH / 700, VW / 820);
  const LW = VW / HS, LH = VH / HS, cx = LW / 2;
  ctx.setTransform(DPR * HS, 0, 0, DPR * HS, 0, 0);
  const top = Math.max(110, LH * 0.5 - 250);
  const pulse = 1 + Math.sin(titleT * 2) * 0.02;
  ctx.save(); ctx.translate(cx, top); ctx.scale(pulse, pulse);
  txt('PLASTIC FRONT', 0, 0, 76, '#d6ffb0', 'center');
  ctx.restore();
  txt('Green vs. Tan', cx, top + 40, 24, '#ffe08a', 'center');
  txt('Lead your little green army men against the evil Tan Overlord and his minions.', cx, top + 74, 15, '#e7f5c9', 'center', false);

  // difficulty
  txt('DIFFICULTY', cx, top + 112, 12, '#c9d8b0', 'center');
  DIFFS.forEach((d, i) => menuBtn(cx - 195 + i * 132, top + 122, 126, 40, d.name, diffIdx === i, () => setDifficulty(i)));
  txt(DIFF().desc, cx, top + 182, 13, '#ffe9a0', 'center', false);

  // mission select
  txt('MISSION', cx, top + 214, 12, '#c9d8b0', 'center');
  const L = LEVELS[missionSel];
  menuBtn(cx - 195, top + 224, 44, 48, '◀', false, () => setMission(missionSel - 1));
  menuBtn(cx + 151, top + 224, 44, 48, '▶', false, () => setMission(missionSel + 1));
  ctx.fillStyle = 'rgba(16,22,12,0.75)'; rrect(cx - 145, top + 224, 290, 48, 10); ctx.fill();
  txt(`${missionSel + 1}. ${L.name}`, cx, top + 245, 16, '#fff', 'center');
  txt(`${L.w} × ${L.h} · ${L.bunkers.length} bunkers${L.boss ? ' · boss' : ''}`, cx, top + 263, 11, '#b5c4a0', 'center', false);

  // deploy + manual
  menuBtn(cx - 195, top + 290, 230, 54, 'DEPLOY', true, deploy, touchMode ? 'tap to start' : padMode ? 'press A' : 'Enter');
  menuBtn(cx + 45, top + 290, 150, 54, 'Field Manual', false, openManual, touchMode ? 'all controls' : padMode ? 'press View' : 'press R');
  const how = touchMode ? 'Left thumb moves · Right thumb aims & fires · Tap buttons to recruit, command and drive'
    : padMode ? 'D-pad: ◀ ▶ difficulty, ▲ ▼ mission · A deploy · View opens the field manual'
    : '← → difficulty · ↑ ↓ mission · Enter deploy · In game: WASD move, mouse aim/fire, H help';
  txt(how, cx, top + 370, 12, '#c9d8b0', 'center', false);
  txt('Keyboard + mouse, Xbox controller, or touch (landscape works best)', cx, LH - 16, 12, 'rgba(230,245,210,0.55)', 'center', false);
}
function drawOverlay(title, lines, prompt, col) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = 'rgba(10,14,8,0.72)'; ctx.fillRect(0, 0, VW, VH);
  txt(title, VW / 2, VH * 0.35, Math.min(60, VW / 12), col, 'center');
  lines.forEach((l, i) => txt(l, VW / 2, VH * 0.35 + 50 + i * 28, VW < 700 ? 13 : 18, '#e7f5c9', 'center', false));
  if (prompt && Math.floor(performance.now() / 500) % 2 === 0) txt(touchMode ? prompt.replace('Click', 'Tap') : padMode ? prompt.replace('Click', 'Press A') : prompt, VW / 2, VH * 0.35 + 70 + lines.length * 28, 20, '#fff', 'center');
}
function onClickOverlay() {
  if (state === 'title') deploy();
  else if (state === 'levelwin') newLevel(G.idx + 1);
  else if (state === 'over') { carry = { plastic: levelStartCarry.plastic, squad: levelStartCarry.squad.slice() }; newLevel(G.idx); }
  else if (state === 'victory') { state = 'title'; G = null; titleArmy = null; }
  else if (state === 'paused') state = 'play';
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  pollPad();
  if (state === 'title') drawTitle(dt);
  else {
    if (state === 'play') update(dt);
    drawWorld(); drawWeather(); drawHUD();
    const mins = Math.floor(G.time / 60), secs = String(Math.floor(G.time % 60)).padStart(2, '0');
    if (state === 'paused') drawOverlay('PAUSED', [touchMode ? 'Tap to resume' : padMode ? 'Press Menu or A to resume' : 'Press P or Esc to resume'], null, '#d6ffb0');
    else if (state === 'levelwin') drawOverlay('MISSION COMPLETE', [`Tan troops destroyed: ${G.kills}   ·   Squad lost: ${G.lost}   ·   Time ${mins}:${secs}`, `Surviving squad members and plastic carry over (+100 bonus plastic).`, `Next: ${LEVELS[G.idx + 1].name}`], 'Click to continue', '#b8ff7a');
    else if (state === 'over') drawOverlay('MISSION FAILED', [G.reason || '', 'The tan menace grows stronger...'], 'Click to retry mission', '#ff7a5a');
    else if (state === 'victory') drawOverlay('VICTORY!', ['The Tan Overlord is melted down into a puddle.', `Final mission: ${G.kills} tan troops destroyed in ${mins}:${secs}.`, 'The backyard is safe — for now.'], 'Click to return to the title', '#ffe08a');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// small debug hook for automated testing
window.__pf = { get G() { return G; }, get state() { return state; }, newLevel, setState: s => { state = s; } };
</script>
